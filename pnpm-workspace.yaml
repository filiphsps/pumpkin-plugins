packages:
  - "packages/*"
  - "extensions/*"
  - "tools/*"
  - "tools/apis/*"
  - "benchmarks/*"
saveExact: true
allowBuilds:
  esbuild: true
  "@vscode/vsce-sign": true
  tsc-rs: true
minimumReleaseAge: 0
catalog:
  smol-toml: 1.9.0
  # API package version 0.1.0 carries Pumpkin WIT ABI 0.1.0 for release 0.2.0+26.3-26.51.
  "@pumpkin-plugins/pumpkin-api": workspace:*
  "@pumpkin-plugins/pumpkin-pie-api": workspace:*
  "@pumpkin-plugins/wasi-capabilities": workspace:*
  "@bytecodealliance/jco": 1.36.1
  # Shared dev tooling versions.
  commander: 15.0.0
  "@commander-js/extra-typings": 15.0.0
  c8: 12.0.0
  cspell: 10.3.6
  "@types/vscode": 1.140.0
  "@vscode/vsce": 4.0.0
  "@vitest/coverage-v8": 5.0.4
  fflate: 0.8.3
  tsc-rs: 0.7.0
  "@badisi/latest-version": 9.0.2
  vitest: 5.0.4
  typescript: 6.0.3
  "@types/node": 24.19.1
  esbuild: 0.28.2
  yaml: 2.9.1
