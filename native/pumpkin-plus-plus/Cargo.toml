[package]
name = "pumpkin-plus-plus"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Native extensions for adding server capabilities to PumpkinMC"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "204a94ed895f041a845630d5a23c094705a0704e" }
pumpkin-world = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "204a94ed895f041a845630d5a23c094705a0704e" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "204a94ed895f041a845630d5a23c094705a0704e", features = ["codegen"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.1", features = ["full"] }
crossbeam = { version = "=0.8.4", default-features = false, features = ["std"] }
# Match features unified by the exact upstream release workspace. These types cross the Rust ABI.
md5 = "=0.8.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking"] }
wasmparser = { version = "=0.259.0", default-features = false, features = ["features", "validate"] }

[profile.dev]
debug = false

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

[[example]]
name = "lifecycle_observer"
crate-type = ["cdylib"]
