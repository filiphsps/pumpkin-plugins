name: Sign Pumpkin plugin
description: Sign Pumpkin plugin WebAssembly files with their Ed25519 release metadata
author: Filiph Sandström
branding:
    icon: lock
    color: purple
inputs:
    plugin-name:
        description: Single-file mode; exact plugin name embedded in the signature metadata
        required: false
    version:
        description: Single-file mode; plugin version embedded without a leading v
        required: false
    wasm-file:
        description: Single-file mode; path to the plugin .wasm file to sign
        required: false
    plugins-manifest:
        description: Batch mode; JSON array of plugin-name, version, and wasm-file entries instead of single-file inputs
        required: false
    developer-name:
        description: Developer name embedded in signed metadata; required in either mode
        required: true
    signing-key:
        description: 32-byte Ed25519 secret seed as 64 hexadecimal characters; required unless warn is true
        required: false
    warn:
        description: Warn and leave the file unchanged when signing-key is empty instead of failing
        required: false
        default: 'false'
runs:
    using: node24
    main: src/index.mjs
