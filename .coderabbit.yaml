chat:
    # Only reply when CodeRabbit is explicitly mentioned.
    auto_reply: false
    art: false
    allow_non_org_members: true
    integrations:
        jira:
            usage: disabled
        linear:
            usage: disabled
knowledge_base:
    code_guidelines:
        filePatterns:
            - CONTRIBUTING.md
            - files: docs/code-style.md
              applyTo: "**/*"
            - files: docs/building.md
              applyTo: packages/**,tools/**,benchmarks/**
            - files: docs/testing.md
              applyTo: packages/**,tools/**,benchmarks/**
            - files: docs/plugin-api/abi-and-runtime.md
              applyTo: packages/**,tools/**
            - files: docs/plugin-info-and-readmes.md
              applyTo: packages/**,actions/**,extensions/**
            - files: docs/plugin-config.md
              applyTo: packages/**
            - files: docs/benchmarking.md
              applyTo: benchmarks/**
            - files: docs/creating-an-action.md
              applyTo: actions/**
            - files: docs/creating-an-extension.md
              applyTo: extensions/**
            - files: docs/port-forwarding.md
              applyTo: packages/upnpumpkin/**,tools/port-mapping/**,tools/apis/upnpumpkin-api/**
    # Keep upstream context focused on source contracts this repository consumes.
    linked_repositories:
        - repository: Pumpkin-MC/Pumpkin
          instructions: >-
              Upstream server implementation and plugin host behavior. Consult when compatibility
              with the pinned server matters.
        - repository: Pumpkin-MC/pumpkin-api-ts
          instructions: >-
              Legacy TypeScript plugin API used as the compatibility baseline and migration source.
              Consult when reviewing API compatibility or migration.
        - repository: Pumpkin-MC/pumpkin-plugin-wit
          instructions: >-
              Canonical upstream WIT source pinned by tools/pumpkin-api/wit.lock.json. Consult when
              reviewing WIT, generated guest declarations, or ABI changes.
        - repository: Pumpkin-MC/Market-Frontend
          instructions: >-
              Pumpkin Market frontend API client and plugin listing models. Consult when changes
              affect Market endpoints, listing metadata, or client compatibility.
        - repository: Pumpkin-MC/ppm
          instructions: >-
              Pumpkin Package Manager Market API client and response models. Consult when changes
              affect Market endpoints or response compatibility.
    learnings:
        scope: local
    issues:
        scope: local
    pull_requests:
        scope: local
    jira:
        usage: disabled
    linear:
        usage: disabled
    mcp:
        usage: disabled
    automatic_linking_mode: auto
issue_enrichment:
    planning:
        auto_planning:
            enabled: false
    auto_enrich:
        enabled: true
    labeling:
        auto_apply_labels: false
