# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Merge repository-specific guidance with the organization's CodeRabbit defaults.
inheritance: true
early_access: true
tone_instructions: >-
    Be concise, technical, and direct. Report actionable issues introduced by the PR, supported by
    concrete evidence. Explain impact and recommend a fix. Avoid speculation, conversational filler,
    repetition, and style feedback already covered by CI.
reviews:
    profile: assertive
    request_changes_workflow: true
    allow_author_approval: false
    high_level_summary_instructions: >-
        Be concise and concrete. Summarize user-visible behavior and compatibility changes; for
        shared tooling, identify affected consumers. Avoid filler and restating the file list.
    high_level_summary_in_walkthrough: false
    auto_title_instructions: >-
        Use a Conventional Commit title in the form `type(scope): imperative summary`. Choose a
        Conventional Commit type (`build`, `chore`, `ci`, `docs`, `feat`, `fix`, `perf`, `refactor`,
        `revert`, `style`, or `test`) and scope it to the affected plugin, tool, action, or area.
        Mark breaking changes as `type(scope)!: summary`. Keep the summary specific, lowercase,
        under 72 characters, and without a trailing period. Avoid a generic `repo` scope when a
        component scope fits.
    review_status: true
    review_details: false
    fail_commit_status: true
    collapse_walkthrough: false
    changed_files_summary: false
    sequence_diagrams: false
    estimate_code_review_effort: false
    assess_linked_issues: true
    related_issues: true
    related_prs: true
    suggested_labels: true
    # Generated from .github/labels.yml by .github/scripts/coderabbit-labels.mjs.
    labeling_instructions:
        - label: "area: actions"
          instructions: Changes to reusable GitHub Actions under actions/.
        - label: "area: ci"
          instructions: Changes to GitHub Actions workflows or CI configuration.
        - label: "area: docs"
          instructions: Documentation, guides, or generated references are a primary part of the change.
        - label: "area: extension"
          instructions: Changes to a Visual Studio Code extension or its tooling.
        - label: "area: plugins"
          instructions: Changes to one or more plugins under packages/.
        - label: "area: runtime"
          instructions: Changes to Pumpkin API/WIT, WASI, WebAssembly, or runtime compatibility.
        - label: "area: tooling"
          instructions: Changes to shared tools, scripts, generators, or repository tooling.
        - label: bug
          instructions: Apply to changes that fix incorrect or broken behavior; pair with the most specific bug subtype
            when one applies.
        - label: "bug: build/release"
          instructions: Compilation, packaging, signing, or release artifact failures; pair with bug.
        - label: "bug: compatibility"
          instructions: Breaks a supported Pumpkin, API, platform, or plugin version; pair with bug.
        - label: "bug: configuration"
          instructions: Plugin configuration is rejected, ignored, or applied incorrectly; pair with bug.
        - label: "bug: crash"
          instructions: The plugin or server crashes, or the plugin fails to load or start; pair with bug.
        - label: "bug: data loss"
          instructions: User or server data is lost, corrupted, or not persisted; pair with bug.
        - label: "bug: incorrect behavior"
          instructions: Output or behavior is incorrect; pair with bug.
        - label: "bug: performance"
          instructions: Excessive lag, CPU or memory use, or slow response; pair with bug.
        - label: "bug: regression"
          instructions: Behavior that worked before is broken in a later change; pair with bug.
        - label: "bug: security"
          instructions: A vulnerability, unsafe access, or integrity weakness; pair with bug.
        - label: dependencies
          instructions: Dependency additions, upgrades, removals, or workspace catalog changes.
        - label: documentation
          instructions: "Use for documentation-focused PRs; pair with area: docs when appropriate."
        - label: enhancement
          instructions: Adds a user-facing feature or capability.
        - label: maintenance
          instructions: Internal upkeep or refactoring without a user-facing feature or bug fix.
        - label: "plugin: Apple Skin"
          instructions: Changes specifically related to packages/apple-skin-pumpkin/.
        - label: "plugin: Bedrock Addon Manager"
          instructions: Changes specifically related to packages/bedrock-addon-manager/.
        - label: "plugin: Distant Horizons Support"
          instructions: Changes specifically related to packages/distant-horizons-support-pumpkin/.
        - label: "plugin: Dynamic Lights"
          instructions: Changes specifically related to packages/dynamic-lights-pumpkin/.
        - label: "plugin: Tab Display"
          instructions: Changes specifically related to packages/tab-display/.
        - label: "plugin: UPnPumpkin"
          instructions: Changes specifically related to packages/upnpumpkin/.
        - label: "plugin: Waypoints"
          instructions: Changes specifically related to packages/waypoints/.
        - label: "priority: critical"
          instructions: Use only for a demonstrated severe issue blocking core use or a release; do not infer urgency from
            the diff alone.
        - label: "priority: high"
          instructions: Use only when clear urgency or substantial user impact is established.
        - label: "priority: low"
          instructions: Use only when low priority is explicitly established; do not infer it for routine changes.
        - label: "priority: medium"
          instructions: Use only when a normal-priority issue or milestone is explicitly established.
        - label: "runtime: quickjs"
          instructions: Apply when the change specifically concerns QuickJS behavior or compatibility.
        - label: "runtime: static-hermes"
          instructions: Apply when the change specifically concerns Static Hermes behavior or compatibility.
        - label: slop
          instructions: Managed by slop_detection; do not suggest from style or wording alone.
        - label: "status: blocked"
          instructions: Use only when the PR is explicitly blocked by an unresolved decision or dependency.
        - label: "status: needs info"
          instructions: Use only when the PR explicitly needs information from its author or reporter.
        - label: "status: needs triage"
          instructions: Use only when the PR is explicitly awaiting owner, classification, or priority.
    mutually_exclusive_groups:
        # Choose at most one runtime, one status and one priority label.
        runtime:
            - "runtime: quickjs"
            - "runtime: static-hermes"
        status:
            - "status: blocked"
            - "status: needs info"
            - "status: needs triage"
        priority:
            - "priority: critical"
            - "priority: high"
            - "priority: medium"
            - "priority: low"
    # CodeRabbit applies eligible labels using the catalog guidance.
    auto_apply_labels: true
    suggested_reviewers: false
    auto_assign_reviewers: false
    enable_prompt_for_ai_agents: false
    in_progress_fortune: false
    poem: false
    # Ignore generated build output and local caches; review their source files instead.
    path_filters:
        - "!**/.cache/**"
        - "!**/.turbo/**"
        - "!**/node_modules/**"
        - "!**/coverage/**"
        - "!**/dist/**"
        - "!**/*.wasm"
    path_instructions:
        - path: .github/common/**
          instructions: >-
              Review local composite actions as executable CI code. Check input validation, token
              and permission scope, expression and shell injection, artifact trust, pinned
              dependencies, and failure propagation.
        - path: .github/workflows/**
          instructions: >-
              Check permissions, expression and shell injection risks, untrusted PR events, secret
              exposure, concurrency, job dependencies, and artifact handoffs. This repository
              intentionally uses pinned toolchains and CI workflows; report an actual security or
              correctness problem rather than generic preferences.
        - path: actions/**
          instructions: >-
              Check handling of untrusted action inputs, shell injection, token scope, error
              propagation, artifact provenance, and signature verification. Do not treat a rebuilt
              artifact as byte-identical to the originally signed or released artifact. Check
              whether changed inputs/outputs affect users.
        - path: benchmarks/**
          instructions: >-
              Treat benchmark results as workload-specific. Check that engine configurations and
              inputs are comparable; don't infer general performance wins from a single run. Keep
              workloads, checksums, and report claims aligned.
        - path: docs/**
          instructions: >-
              Check claims against source, pinned versions, and CI behavior. Verify links and the
              documentation index. Generated README content should come from its owning generator;
              don't recommend hand-editing generated sections.
        - path: extensions/**
          instructions: >-
              Check compatibility with the declared VS Code engine and API range, activation,
              contributed commands and settings, workspace trust, tests, build output, and VSIX
              packaging. Follow the extension CI workflow.
        - path: packages/**
          instructions: >-
              Review observable behavior under the pinned Pumpkin/WIT API, not assumptions about
              Node.js or browsers. Check player permissions, platform capability gates, cleanup of
              listeners/tasks, host-resource lifetime, configuration persistence, and
              invalid/untrusted input. WIT u64/s64 values are bigint; flag lossy conversions or
              incompatible argument types. New behavior and bug fixes should have appropriate unit
              tests and, when host behavior is involved, real-server integration tests. Flag
              concrete regressions only.
        - path: scripts/**
          instructions: >-
              Check input validation, subprocess arguments, quoting, temporary-file and cache
              cleanup, error propagation, and affected script tests. For release scripts, check that
              GitHub mutations and artifact handling match the documented dry-run and release
              behavior.
        - path: tools/pumpkin-api/**
          instructions: >-
              Check the pinned upstream WIT source, generated guest declarations, API/WIT ABI, and
              the Pumpkin release used by the test harness as one compatibility contract. Keep
              package and WIT ABI versions distinct, and update the compatibility inventory and
              guidance when that contract changes.
        - path: tools/static-hermes-runtime/**
          instructions: >-
              Check the pinned Hermes revision, toolchain pins, WIT ABI, and WASI compatibility. For
              native code directly using Hermes GC internals, follow:
              root live GC values across safepoints, validate CallResult before use,
              and respect handle lifetimes. Do not apply Hermes-internal rooting rules to TypeScript
              values or ordinary JSI wrappers. Check both Static Hermes behavior and QuickJS
              compatibility where shared interfaces change.
        - path: tools/**
          instructions: >-
              Changes to shared libraries can affect several plugins and packed external consumers.
              Check exported API contracts, transitive callers, package metadata, and downstream
              compatibility. Generated WIT types and READMEs must be updated through their owning
              generators, not edited by hand.
    slop_detection:
        label: slop
        include_all_authors: false
    auto_review:
        enabled: true
        auto_incremental_review: true
        drafts: true
        # Zero keeps reviews enabled for every update to an open pull request.
        auto_pause_after_reviewed_commits: 0
        # Skip work-in-progress and release-generated pull request titles.
        ignore_title_keywords:
            - WIP
            - "WIP:"
            - "DRAFT:"
            - DO NOT MERGE
            - "chore(master): release"
            - ": update upstream pin"
    finishing_touches:
        unit_tests:
            enabled: false
        docstrings:
            enabled: false
        simplify:
            enabled: false
    # Keep repository-specific checks advisory until their signal is proven.
    pre_merge_checks:
        docstrings:
            mode: off
        title:
            mode: off
        custom_checks:
            - name: External compatibility
              mode: warning
              instructions: >-
                  Apply only when the diff changes an externally observable contract: plugin
                  commands, permissions, configuration or persistence, exported package APIs,
                  WIT/WASI interfaces, runtime compatibility, GitHub Action inputs or outputs, or
                  release artifacts. Identify the previous and new behavior, affected callers or
                  consumers, and whether the change is intentional and documented. Pass as not
                  applicable when no contract changes. Report only changes supported by the diff and
                  repository docs.
            - name: Pumpkin API and server ABI alignment
              mode: warning
              instructions: >-
                  Apply when the diff changes the WIT pin in tools/pumpkin-api/wit.lock.json, the
                  version in tools/pumpkin-api/package.json, generated guest declarations, or the
                  test server pin in tools/test-harness/src/pumpkin-version.ts. When the host API or
                  WIT changes, verify that the WIT ABI
                  matches the intended Pumpkin release and update the affected pin, compatibility
                  inventory, and guidance. Do not require an ABI or server pin change for a
                  TypeScript-facade-only change. Use docs/plugin-api/abi-and-runtime.md: the npm
                  package version, WIT ABI, and Pumpkin server version are distinct values. Pass as
                  not applicable when these contracts are untouched; report only a mismatch
                  supported by repository evidence.
            - name: Generated docs match their sources
              mode: warning
              instructions: >-
                  Apply when the diff changes plugin metadata or configuration, action inputs or
                  outputs, extension package metadata, or another source that feeds generated README
                  content or documentation catalogs. Verify the generated Markdown and catalog
                  entries match their source and generated blocks were not edited by hand. Pass as
                  not applicable when no generated documentation source or output is affected.
            - name: Shared dependencies use the workspace catalog
              mode: warning
              instructions: >-
                  Apply when package manifests or pnpm-workspace.yaml dependency entries change.
                  Verify dependency versions are pinned and dependencies shared by multiple
                  workspace packages use catalog references in pnpm-workspace.yaml. Do not require a
                  catalog entry for a dependency used by only one package. Pass as not applicable
                  when dependency declarations are untouched.
