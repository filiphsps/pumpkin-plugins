name: Sync GitHub labels

on:
    push:
        branches:
            - master
        paths:
            - .github/labels.yml

concurrency:
    group: sync-labels-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    sync:
        name: 🏷️ Sync label catalog
        if: ${{ !github.event.repository.fork }}
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        steps:
            - name: 🔑 Create label sync token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-issues: write

            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: ⚙️ Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: 🔧 Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: 📦 Install catalog parser dependency
              run: pnpm install --filter pumpkin-plugins --frozen-lockfile --ignore-scripts

            - name: 🧽 Create standard label manifest
              run: node .github/scripts/coderabbit-labels.mjs --manifest "$RUNNER_TEMP/labels-for-sync.yml"

            - name: 🏷️ Sync repository labels
              uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
              with:
                  config-file: ${{ runner.temp }}/labels-for-sync.yml
                  token: ${{ steps.app-token.outputs.token }}
                  delete-other-labels: false
