name: Sync GitHub labels and CodeRabbit guidance

on:
    push:
        branches:
            - master
        paths:
            - .github/labels.yml

concurrency:
    group: sync-labels-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    sync:
        name: 🏷️ Sync label catalog
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        env:
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        steps:
            - name: 🔑 Create label sync token
              id: app-token
              uses: actions/create-github-app-token@v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write

            - name: 🕶️ Checkout default branch
              id: checkout
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  token: ${{ steps.app-token.outputs.token }}
                  fetch-depth: 0

            - name: 🧽 Create standard label manifest
              id: manifest
              env:
                  LABELS_FILE: .github/labels.yml
                  MANIFEST_FILE: ${{ runner.temp }}/labels-for-sync.yml
              run: |
                  ruby -ryaml <<'RUBY'
                  labels = YAML.safe_load(File.read(ENV.fetch('LABELS_FILE')), permitted_classes: [], aliases: false)
                  abort 'The label catalog must be a YAML array.' unless labels.is_a?(Array)
                  names = labels.map do |label|
                      abort 'Each label definition must be a mapping.' unless label.is_a?(Hash)
                      allowed = %w[name color description aliases ai_apply_when]
                      unknown = label.keys - allowed
                      abort "Unsupported label fields: #{unknown.join(', ')}" unless unknown.empty?
                      abort 'Every label needs a name and color.' unless label['name'].is_a?(String) && label['color'].is_a?(String)
                      if label.key?('ai_apply_when') && (!label['ai_apply_when'].is_a?(String) || label['ai_apply_when'].empty?)
                          abort "ai_apply_when for #{label['name']} must be a non-empty string."
                      end
                      label.fetch('name')
                  end
                  abort 'Label names must be unique.' unless names.uniq.length == names.length
                  allowed = %w[name color description aliases]
                  manifest = labels.map { |label| label.select { |key, _value| allowed.include?(key) } }
                  File.write(ENV.fetch('MANIFEST_FILE'), YAML.dump(manifest))
                  RUBY

            - name: 🏷️ Sync repository labels
              id: label-sync
              uses: EndBug/label-sync@v2.3.3
              with:
                  config-file: ${{ runner.temp }}/labels-for-sync.yml
                  token: ${{ steps.app-token.outputs.token }}
                  delete-other-labels: false

            - name: 🐇 Update CodeRabbit label guidance
              id: coderabbit
              run: |
                  ruby -ryaml <<'RUBY'
                  labels = YAML.safe_load(File.read('.github/labels.yml'), permitted_classes: [], aliases: false)
                  eligible = labels.map do |label|
                      instruction = label['ai_apply_when']
                      next unless instruction
                      abort "ai_apply_when for #{label['name']} exceeds 3000 characters." if instruction.length > 3000
                      { 'label' => label.fetch('name'), 'instructions' => instruction }
                  end.compact
                  abort 'At least one label must define ai_apply_when.' if eligible.empty?

                  path = '.coderabbit.yaml'
                  contents = File.read(path)
                  start_marker = "    labeling_instructions:\n"
                  finish_marker = "    mutually_exclusive_groups:\n"
                  abort 'CodeRabbit label section markers are missing or duplicated.' unless
                      contents.scan(start_marker).length == 1 && contents.scan(finish_marker).length == 1
                  start = contents.index(start_marker)
                  finish = contents.index(finish_marker, start)
                  abort 'CodeRabbit label section markers are out of order.' unless finish && finish > start

                  rendered = eligible.map do |entry|
                      lines = YAML.dump(entry).sub(/\A---\s*\n/, '').lines
                      "        - #{lines.shift}" + lines.map { |line| "          #{line}" }.join
                  end.join
                  contents[start...finish] = "    labeling_instructions:\n#{rendered}"

                  original_config = YAML.safe_load(File.read(path), permitted_classes: [], aliases: false)
                  auto_apply = /^    auto_apply_labels: (?:true|false)$/
                  abort 'Expected one reviews.auto_apply_labels setting.' unless contents.scan(auto_apply).length == 1
                  contents.sub!(auto_apply, '    auto_apply_labels: true')
                  old_comment = '# Keep suggestions reviewable; maintainers apply labels manually.'
                  contents.sub!(old_comment, '# CodeRabbit applies eligible labels using the catalog guidance.')

                  config = YAML.safe_load(contents, permitted_classes: [], aliases: false)
                  abort 'Generated CodeRabbit labels failed validation.' unless
                      config.dig('reviews', 'labeling_instructions').length == eligible.length &&
                          config.dig('reviews', 'auto_apply_labels') == true &&
                          config.dig('issue_enrichment', 'labeling', 'auto_apply_labels') ==
                              original_config.dig('issue_enrichment', 'labeling', 'auto_apply_labels')
                  File.write(path, contents)
                  RUBY

            - name: 📝 Commit CodeRabbit label guidance
              id: commit-coderabbit
              run: |
                  set -euo pipefail
                  if git diff --quiet -- .coderabbit.yaml; then
                      echo 'CodeRabbit label guidance is already current.'
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -- .coderabbit.yaml
                  git commit -m 'chore: sync CodeRabbit label guidance'
                  git push origin "HEAD:${DEFAULT_BRANCH}"
