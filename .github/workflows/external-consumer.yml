name: External consumer

on:
    workflow_call:
        inputs:
            platforms:
                description: JSON array of platforms to test, from "Linux x64", "macOS arm64" and "Windows x64"
                type: string
                default: '["Linux x64", "macOS arm64", "Windows x64"]'

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    external-consumer:
        name: 📦 External consumer (${{ matrix.platform }})
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                platform: ${{ fromJSON(inputs.platforms) }}
        runs-on: ${{ fromJSON('{"Linux x64":"ubuntu-26.04","macOS arm64":"macos-15","Windows x64":"windows-2025"}')[matrix.platform] }}
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 📂 Prepare external consumer caches
              id: prepare-external-consumer-caches
              shell: bash
              run: mkdir -p .cache/external-consumer/pnpm-store .cache/hermes

            - name: 💾 Restore external consumer pnpm store
              id: external-consumer-pnpm-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .cache/external-consumer/pnpm-store
                  key: external-consumer-pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}

            - name: 🔧 Setup Static Hermes cache
              id: setup-static-hermes
              uses: ./.github/common/setup-static-hermes

            - name: 🪟 Setup MSVC 2022 toolset 14.44
              id: setup-msvc-2022-toolset-14-44
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
              with:
                  arch: x64
                  toolset: '14.44'

            - name: 🔎 Verify pinned Ninja executable on Windows
              id: verify-pinned-ninja-executable-on-windows
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  NINJA_VERSION: ${{ steps.setup-static-hermes.outputs.ninja-version }}
              run: |
                  $expected = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'host-tools/bin/ninja.exe'))
                  $resolved = Get-Command ninja -ErrorAction Stop
                  $actual = [System.IO.Path]::GetFullPath($resolved.Source)
                  if ($actual -ne $expected) {
                      throw "Expected pinned Ninja at '$expected', but PATH resolved '$actual'"
                  }
                  $version = (& $actual --version).Trim()
                  $versionPattern = '^' + [regex]::Escape($env:NINJA_VERSION) + '(?:$|[.+-])'
                  if ($version -notmatch $versionPattern) {
                      throw "Expected Ninja $env:NINJA_VERSION at '$actual', got '$version'"
                  }

            - name: 🔎 Verify pinned host toolchain
              id: verify-pinned-host-toolchain
              env:
                  CMAKE_VERSION: ${{ steps.setup-static-hermes.outputs.cmake-version }}
                  NINJA_VERSION: ${{ steps.setup-static-hermes.outputs.ninja-version }}
                  RUST_VERSION: ${{ steps.setup-static-hermes.outputs.rust-toolchain-version }}
              shell: bash
              run: |
                  test "$(cmake --version | head -n 1)" = "cmake version $CMAKE_VERSION"
                  ninja_version="$(ninja --version)"
                  case "$ninja_version" in
                      "$NINJA_VERSION"|"$NINJA_VERSION".*|"$NINJA_VERSION"+*|"$NINJA_VERSION"-*) ;;
                      *) echo "Expected Ninja $NINJA_VERSION, got '$ninja_version'" >&2; exit 1 ;;
                  esac
                  rustup toolchain install "$RUST_VERSION" --profile minimal
                  rustc "+$RUST_VERSION" --version
                  cargo "+$RUST_VERSION" --version
                  if [[ "$RUNNER_OS" == Windows ]]; then
                      printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/cl-smoke.c"
                      MSYS_NO_PATHCONV=1 cl /Bv /nologo /c "$RUNNER_TEMP/cl-smoke.c" /Fo"$RUNNER_TEMP/cl-smoke.obj"
                  fi

            - name: 📦 Pack, install, create, typecheck and build outside the monorepo
              id: external-consumer
              run: node scripts/ci-run.mjs "Pack, install and build standalone consumers" -- pnpm run test:external-consumer
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PUMPKIN_EXTERNAL_CONSUMER_PNPM_STORE_DIR: ${{ github.workspace }}/.cache/external-consumer/pnpm-store
                  PUMPKIN_PLUGINS_VERBOSE_BUILD: ${{ matrix.platform == 'Windows x64' && '1' || '0' }}

            - name: 💾 Save external consumer pnpm store
              id: save-external-consumer-pnpm-store
              if: >-
                  ${{
                    github.event_name == 'push' &&
                    steps.external-consumer.outcome == 'success' &&
                    steps.external-consumer-pnpm-cache.outputs.cache-hit != 'true'
                  }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .cache/external-consumer/pnpm-store
                  key: external-consumer-pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}

            - name: 💾 Save Static Hermes cache
              id: save-static-hermes-cache
              if: >-
                  ${{
                    github.event_name == 'push' &&
                    steps.external-consumer.outcome == 'success' &&
                    steps.setup-static-hermes.outputs.hermes-cache-hit != 'true'
                  }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ github.workspace }}/.cache/hermes
                  key: ${{ steps.setup-static-hermes.outputs.hermes-cache-key }}

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: External consumers (${{ matrix.platform }})
                  note: Checks public package metadata, TypeScript and JavaScript starters, and the standalone codemod outside this repository.
