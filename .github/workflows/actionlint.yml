name: Actionlint

on:
    pull_request:
    push:
        branches:
            - master
            - main
    workflow_dispatch:

concurrency:
    group: actionlint-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint:
        name: 🔍 Lint GitHub workflows
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout
              uses: actions/checkout@v7.0.1

            - name: 🔧 Setup actionlint
              id: setup-actionlint
              uses: ./.github/common/setup-actionlint

            - name: 🔍 Lint GitHub workflows
              id: workflows
              run: node scripts/ci-run.mjs "GitHub workflow validation" -- actionlint -color

            - name: 📋 Job summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Workflow validation
                  steps: ${{ toJSON(steps) }}
