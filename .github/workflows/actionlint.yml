name: Actionlint

on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: actionlint-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint:
        name: 🔍 Lint GitHub workflows
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              # The scope check needs commit history but no file contents from earlier commits.
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: 🧭 Check whether workflow lint is needed
              id: scope
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  set -euo pipefail
                  if [[ -z "$BASE" || "$BASE" == '0000000000000000000000000000000000000000' ]]; then
                      printf 'config_only=false\n' >> "$GITHUB_OUTPUT"
                  else
                      node scripts/changed-areas.mjs --config-only "$BASE" "$HEAD"
                  fi

            - name: 🔧 Setup actionlint
              id: setup-actionlint
              if: steps.scope.outputs.config_only != 'true'
              uses: ./.github/common/setup-actionlint

            - name: 🔍 Lint GitHub workflows
              id: workflows
              if: steps.scope.outputs.config_only != 'true'
              run: node scripts/ci-run.mjs "GitHub workflow validation" -- actionlint -color

            - name: 📋 Job summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Workflow validation
