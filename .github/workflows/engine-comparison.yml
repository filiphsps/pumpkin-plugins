name: Engine comparison

on:
    workflow_call:

permissions:
    contents: read

jobs:
    compare:
        name: 📊 Compare QuickJS and Static Hermes
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔧 Restore Static Hermes toolchain
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Verify Static Hermes is prepared
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            - name: 📊 Compare QuickJS and Static Hermes
              env:
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/engine-comparison-logs
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime compare-engines

            - name: 📤 Upload engine comparison server logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: engine-comparison-pumpkin-logs
                  path: ${{ runner.temp }}/engine-comparison-logs
                  if-no-files-found: ignore
