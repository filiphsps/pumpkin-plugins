name: Engine comparison

on:
    workflow_call:

permissions:
    contents: read

jobs:
    variants:
        name: 🔎 Generate benchmark matrix
        runs-on: ubuntu-26.04
        outputs:
            jobs: ${{ steps.generate.outputs.jobs }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🟢 Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version

            - name: 🧩 Generate matrix from engine variants
              id: generate
              run: node benchmarks/engine-comparison/scripts/write-engine-comparison-matrix.ts

    benchmark:
        name: 🧪 ${{ matrix.variant }}
        needs: [variants]
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.variants.outputs.jobs) }}
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap
              with:
                  cache-suffix: -${{ matrix.variant }}

            - name: 🔧 Restore Static Hermes toolchain
              id: setup-hermes
              if: startsWith(matrix.variant, 'static-hermes-')
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Verify Static Hermes is prepared
              id: verify-static-hermes-is-prepared
              if: startsWith(matrix.variant, 'static-hermes-')
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            # The shared snapshot contains Hades. Keep malloc's separate archives and fingerprint
            # so each variant can reuse compilation without replacing that immutable snapshot.
            # Building malloc reconfigures the shared host build, which rewrites its compiler export,
            # and the malloc fingerprint records that file. Restore it only after the Hades check
            # above, which would otherwise see a changed host build and rebuild Hades.
            - name: 💾 Restore and save malloc Static Hermes build
              id: cache-malloc-static-hermes-build
              if: contains(matrix.variant, '-malloc-') && steps.bootstrap.outputs.save-caches == 'true'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .cache/hermes/build-wasip2-malloc
                      .cache/hermes/prepared-build-malloc.json
                      .cache/hermes/build-host/ImportHostCompilers.cmake
                  key: ${{ steps.setup-hermes.outputs.hermes-cache-key }}-benchmark-malloc-v2

            - name: 💾 Restore malloc Static Hermes build
              id: restore-malloc-static-hermes-build
              if: contains(matrix.variant, '-malloc-') && steps.bootstrap.outputs.save-caches != 'true'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .cache/hermes/build-wasip2-malloc
                      .cache/hermes/prepared-build-malloc.json
                      .cache/hermes/build-host/ImportHostCompilers.cmake
                  key: ${{ steps.setup-hermes.outputs.hermes-cache-key }}-benchmark-malloc-v2

            - name: 📊 Run benchmark variant
              id: run-benchmark-variant
              env:
                  ENGINE_COMPARISON_VARIANT: ${{ matrix.variant }}
                  ENGINE_COMPARISON_RESULT_PATH: ${{ runner.temp }}/engine-comparison-results/${{ matrix.variant }}.json
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/engine-comparison-logs
              run: |
                  node scripts/ci-run.mjs "Engine comparison ($ENGINE_COMPARISON_VARIANT)" -- pnpm --filter @pumpkin-plugins/engine-comparison compare-engines

            - name: 📤 Upload benchmark result
              id: upload-benchmark-result
              if: matrix.kind == 'benchmark'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: engine-comparison-result-${{ matrix.variant }}
                  path: ${{ runner.temp }}/engine-comparison-results/${{ matrix.variant }}.json
                  retention-days: 1
                  if-no-files-found: error

            - name: 📤 Upload engine comparison server logs
              id: upload-engine-comparison-server-logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  retention-days: 1
                  name: engine-comparison-pumpkin-logs-${{ matrix.variant }}
                  path: ${{ runner.temp }}/engine-comparison-logs
                  if-no-files-found: ignore

            - name: 📋 Failed variant summary
              id: failed-variant-summary
              if: failure()
              uses: ./.github/common/job-summary
              with:
                  title: Engine comparison (${{ matrix.variant }})
                  tests: 'true'

    report:
        name: 📋 Collect and display results
        needs: [benchmark]
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📥 Download benchmark matrix results
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: engine-comparison-result-*
                  path: ${{ runner.temp }}/engine-comparison-results
                  merge-multiple: true

            - name: 📋 Build combined report
              env:
                  ENGINE_COMPARISON_RESULT_DIR: ${{ runner.temp }}/engine-comparison-results
                  ENGINE_COMPARISON_REPORT_DIR: ${{ runner.temp }}/engine-comparison-report
              run: pnpm --filter @pumpkin-plugins/engine-comparison benchmark:collect

            - name: 📤 Upload combined benchmark report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: engine-comparison-report
                  path: ${{ runner.temp }}/engine-comparison-report
                  retention-days: 90
                  if-no-files-found: error
