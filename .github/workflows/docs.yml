name: Docs

on:
    pull_request:
        paths:
            - '**/*.md'
            - 'docs/**'
            - 'packages/*/docs/**'
            - 'packages/**'
            - 'tools/*/docs/**'
            - 'actions/*/docs/**'
            - 'actions/**'
            - 'scripts/**'
            - 'tools/**'
            - 'typedoc.json'
            - 'tsconfig.docs.json'
            - 'scripts/generate-api-references.mjs'
            - 'docs/.vitepress/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
            - '.node-version'
            - '.github/common/bootstrap/**'
            - '.github/workflows/docs.yml'
            - 'scripts/check-docs.mjs'
            - 'LICENSE'
    push:
        branches:
            - master
            - main
        paths:
            - '**/*.md'
            - 'docs/**'
            - 'packages/*/docs/**'
            - 'packages/**'
            - 'tools/*/docs/**'
            - 'actions/*/docs/**'
            - 'actions/**'
            - 'scripts/**'
            - 'tools/**'
            - 'typedoc.json'
            - 'tsconfig.docs.json'
            - 'scripts/generate-api-references.mjs'
            - 'docs/.vitepress/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
            - '.node-version'
            - '.github/common/bootstrap/**'
            - '.github/workflows/docs.yml'
            - 'scripts/check-docs.mjs'
            - 'LICENSE'
    workflow_dispatch:

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: false

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    build:
        name: 📚 Build and check docs
        timeout-minutes: 20
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Check generated READMEs
              run: pnpm run readme:check

            - name: 🧭 Check repository docs
              run: pnpm run check

            - name: 🏗️ Build the documentation site
              run: pnpm run docs
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: 📦 Upload Pages artifact
              uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: docs/.vitepress/dist

            - name: 📦 Upload site for the gh-pages mirror
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: docs-site
                  path: docs/.vitepress/dist
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: 🚀 Publish GitHub Pages
        needs: [build]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        permissions:
            actions: read
            contents: write
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 📥 Download built site
              uses: actions/download-artifact@v8.0.2
              with:
                  name: docs-site
                  path: ${{ runner.temp }}/docs-site

            - name: 🌿 Update gh-pages branch mirror
              env:
                  SITE_DIRECTORY: ${{ runner.temp }}/docs-site
              run: |
                  if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
                      git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
                      git switch --track -c gh-pages origin/gh-pages
                  else
                      git switch --orphan gh-pages
                  fi

                  git rm -r -f --ignore-unmatch .
                  cp -R "$SITE_DIRECTORY"/. .
                  touch .nojekyll
                  git add --all
                  if git diff --cached --quiet; then
                      echo "The gh-pages branch already contains this site."
                      exit 0
                  fi

                  git -c user.name='github-actions[bot]' \
                      -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      commit -m 'docs: publish GitHub Pages site'
                  git push origin gh-pages

            - name: ⚙️ Configure Pages
              uses: actions/configure-pages@v6.0.0

            - name: 🚀 Deploy site to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5.0.1
