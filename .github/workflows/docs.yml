name: Docs

on:
    pull_request:
        paths: &docs-paths
            - '**/*.md'
            - 'docs/**'
            - 'packages/**'
            - 'extensions/**'
            - 'tools/**'
            - 'actions/**'
            - 'scripts/**'
            - 'typedoc.json'
            - 'tsconfig.docs.json'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'tsconfig.base.json'
            - '.node-version'
            - '.github/common/bootstrap/**'
            - '.github/workflows/docs.yml'
            - 'LICENSE'
    push:
        branches:
            - master
        paths: *docs-paths
    workflow_dispatch:

concurrency:
    group: docs-${{ github.ref }}
    # Let a publish finish; a newer pull request run replaces an older one.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    build:
        name: 📚 Build and check docs
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        timeout-minutes: 20
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            # CI skips docs-only changes, so this workflow runs the docs checks for them.
            - name: 📝 Check generated READMEs
              id: check-generated-readmes
              run: node scripts/ci-run.mjs "Generated READMEs" -- pnpm run readme:check

            - name: 🧭 Check repository docs
              id: check-repository-docs
              run: node scripts/ci-run.mjs "Repository documentation checks" -- pnpm run check

            - name: 🧪 Test documentation helpers
              id: test-documentation-helpers
              run: node scripts/ci-run.mjs "Documentation helper tests" -- node --test docs/.vitepress/team.data.test.mjs docs/.vitepress/doc-links.test.mjs

            - name: 🏗️ Build the documentation site
              id: build-the-documentation-site
              run: node scripts/ci-run.mjs "Build API references and documentation site" -- pnpm run docs
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: 📦 Upload Pages artifact
              id: upload-pages-artifact
              if: github.event_name == 'push'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: docs/.vitepress/dist

            - name: 📦 Upload site for the gh-pages mirror
              id: upload-site-for-the-gh-pages-mirror
              if: github.event_name == 'push'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: docs-site
                  path: docs/.vitepress/dist
                  if-no-files-found: error
                  retention-days: 1

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Documentation site verification
                  note: Pull requests validate the site; default-branch pushes also publish it.

    publish:
        name: 🚀 Publish GitHub Pages
        needs: [build]
        if: ${{ !github.event.repository.fork && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        permissions:
            actions: read
            contents: write
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 📥 Download built site
              id: download-built-site
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: docs-site
                  path: ${{ runner.temp }}/docs-site

            - name: 📋 Preserve deployment summary tools
              id: preserve-deployment-summary-tools
              run: |
                  mkdir -p "$RUNNER_TEMP/docs-summary/utils"
                  cp scripts/ci-summary.mjs "$RUNNER_TEMP/docs-summary/"
                  cp scripts/utils/ci-output.mjs "$RUNNER_TEMP/docs-summary/utils/"

            - name: 🌿 Update gh-pages branch mirror
              id: update-gh-pages-branch-mirror
              env:
                  SITE_DIRECTORY: ${{ runner.temp }}/docs-site
              run: |
                  if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
                      git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
                      git switch --track -c gh-pages origin/gh-pages
                  else
                      git switch --orphan gh-pages
                  fi

                  git rm -r -f --ignore-unmatch .
                  cp -R "$SITE_DIRECTORY"/. .
                  touch .nojekyll
                  git add --all
                  if git diff --cached --quiet; then
                      echo "The gh-pages branch already contains this site."
                      exit 0
                  fi

                  git -c user.name='github-actions[bot]' \
                      -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      commit -m 'docs: publish GitHub Pages site'
                  git push origin gh-pages

            - name: ⚙️ Configure Pages
              id: configure-pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: 🚀 Deploy site to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

            - name: 📋 Job summary
              id: job-summary
              if: always()
              env:
                  CI_JOB_STATUS: ${{ job.status }}
                  CI_ARTIFACT_URL: ${{ steps.deployment.outputs.page_url }}
                  CI_LINK_LABEL: Open the published documentation
              run: node "$RUNNER_TEMP/docs-summary/ci-summary.mjs" --title "Documentation deployment"
