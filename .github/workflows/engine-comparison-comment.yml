name: Engine comparison comment

on:
    workflow_run:
        workflows: [CI]
        types: [completed]

concurrency:
    group: engine-comparison-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    report:
        name: 📈 Report benchmark changes
        if: >-
            ${{
              !github.event.repository.fork &&
              github.event.workflow_run.event == 'pull_request' &&
              github.event.workflow_run.conclusion == 'success' &&
              !startsWith(github.event.workflow_run.head_branch, 'release-please--branches--')
            }}
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        permissions:
            actions: read
            contents: read
        steps:
            - name: 🔑 Create benchmark comment token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-actions: read
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - name: 🕶️ Checkout trusted default-branch scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}

            # GitHub leaves workflow_run.pull_requests empty for pull requests from forks, so find the
            # open pull request whose head is this run's repository, branch and commit.
            - name: 🔎 Find the pull request for this run
              id: pull-request
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  GH_REPO: ${{ github.repository }}
                  HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
                  HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
                  HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  pulls="$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH")"
                  jq -r '
                      [.[] | select(.head.sha == env.HEAD_SHA and .head.repo.full_name == env.HEAD_REPOSITORY)][0] // empty
                      | select((.number | type) == "number" and (.base.sha | test("^[0-9a-f]{40}$")))
                      | "number=\(.number)\nbase_sha=\(.base.sha)"
                  ' <<< "$pulls" >> "$GITHUB_OUTPUT"

            - name: 🔎 Find benchmark artifacts and a matching baseline
              id: discover
              if: steps.pull-request.outputs.number != ''
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  GITHUB_API_URL: ${{ github.api_url }}
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
                  PR_NUMBER: ${{ steps.pull-request.outputs.number }}
                  PR_BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: node scripts/engine-comparison-comment.mjs discover

            # The report comes from pull request code, possibly from a fork. It is downloaded outside
            # the workspace and read only by default-branch scripts that validate it.
            - name: 📥 Download current benchmark report
              if: steps.discover.outputs.has_report == 'true'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: engine-comparison-report
                  run-id: ${{ github.event.workflow_run.id }}
                  repository: ${{ github.repository }}
                  github-token: ${{ steps.app-token.outputs.token }}
                  path: ${{ runner.temp }}/engine-comparison-head

            - name: 📥 Download latest matching default-branch baseline
              if: steps.discover.outputs.has_report == 'true' && steps.discover.outputs.baseline_run_id != ''
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: engine-comparison-report
                  run-id: ${{ steps.discover.outputs.baseline_run_id }}
                  repository: ${{ github.repository }}
                  github-token: ${{ steps.app-token.outputs.token }}
                  path: ${{ runner.temp }}/engine-comparison-baseline

            - name: 🚀 Bootstrap
              if: steps.discover.outputs.has_report == 'true'
              uses: ./.github/common/bootstrap

            - name: 📈 Build light and dark benchmark SVGs
              if: steps.discover.outputs.has_report == 'true'
              env:
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
                  CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
                  BASELINE_SHA: ${{ steps.discover.outputs.baseline_sha }}
                  BENCHMARK_JITTER_PERCENT: ${{ vars.BENCHMARK_JITTER_PERCENT || '10' }}
                  ENGINE_COMPARISON_HEAD_RESULTS: ${{ runner.temp }}/engine-comparison-head/engine-comparison-results.json
                  ENGINE_COMPARISON_BASELINE_RESULTS: ${{ steps.discover.outputs.baseline_run_id != '' && format('{0}/engine-comparison-baseline/engine-comparison-results.json', runner.temp) || '' }}
                  BENCHMARK_CHANGE_SVG_LIGHT: ${{ runner.temp }}/engine-comparison-change-light.svg
                  BENCHMARK_CHANGE_SVG_DARK: ${{ runner.temp }}/engine-comparison-change-dark.svg
                  NO_BASELINE_REASON: No successful benchmark artifact was found on the default branch at or before base ${{ steps.discover.outputs.pr_base_sha }}.
              run: node benchmarks/engine-comparison/scripts/build-benchmark-comment.ts

            - name: 🖼️ Publish benchmark SVGs
              id: publish-chart
              if: steps.discover.outputs.has_report == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  GITHUB_API_URL: ${{ github.api_url }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_SERVER_URL: ${{ github.server_url }}
                  BENCHMARK_CHANGE_SVG_LIGHT: ${{ runner.temp }}/engine-comparison-change-light.svg
                  BENCHMARK_CHANGE_SVG_DARK: ${{ runner.temp }}/engine-comparison-change-dark.svg
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: node scripts/engine-comparison-chart.mjs publish

            - name: 📝 Build benchmark comment
              if: steps.discover.outputs.has_report == 'true'
              env:
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
                  CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
                  BASELINE_SHA: ${{ steps.discover.outputs.baseline_sha }}
                  BENCHMARK_JITTER_PERCENT: ${{ vars.BENCHMARK_JITTER_PERCENT || '10' }}
                  ENGINE_COMPARISON_HEAD_RESULTS: ${{ runner.temp }}/engine-comparison-head/engine-comparison-results.json
                  ENGINE_COMPARISON_BASELINE_RESULTS: ${{ steps.discover.outputs.baseline_run_id != '' && format('{0}/engine-comparison-baseline/engine-comparison-results.json', runner.temp) || '' }}
                  BENCHMARK_COMMENT_FILE: ${{ runner.temp }}/engine-comparison-comment.md
                  BENCHMARK_CHANGE_SVG_LIGHT_URL: ${{ steps.publish-chart.outputs.light_chart_url }}
                  BENCHMARK_CHANGE_SVG_DARK_URL: ${{ steps.publish-chart.outputs.dark_chart_url }}
                  NO_BASELINE_REASON: No successful benchmark artifact was found on the default branch at or before base ${{ steps.discover.outputs.pr_base_sha }}.
              run: node benchmarks/engine-comparison/scripts/build-benchmark-comment.ts

            - name: 💬 Create or update the benchmark comment
              if: steps.discover.outputs.has_report == 'true'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  header: engine-comparison-benchmark
                  number_force: ${{ steps.pull-request.outputs.number }}
                  path: ${{ runner.temp }}/engine-comparison-comment.md
                  skip_unchanged: true
