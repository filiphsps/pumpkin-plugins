name: Issue form and label validation

on:
    pull_request:
        paths:
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/scripts/**'
            - '.github/workflows/issue-forms.yml'
            - '.github/common/bootstrap/**'
            - '.github/labels.yml'
            - '.coderabbit.yaml'
            - 'packages/*/package.json'
    push:
        branches:
            - master
        paths:
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/scripts/**'
            - '.github/workflows/issue-forms.yml'
            - '.github/common/bootstrap/**'
            - '.github/labels.yml'
            - '.coderabbit.yaml'
            - 'packages/*/package.json'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        name: 📝 Validate issue forms
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: ✅ Validate issue form definitions
              run: node .github/scripts/validate-issue-forms.mjs

            - name: 🏷️ Check label catalog and CodeRabbit label guidance
              run: node .github/scripts/coderabbit-labels.mjs --check

            - name: 🧪 Test issue intake and label scripts
              run: node --test .github/scripts/*.test.mjs
