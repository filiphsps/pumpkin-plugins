name: Issue form validation

on:
    pull_request:
        paths:
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/scripts/issue-form-rules.mjs'
            - '.github/scripts/issue-forms.mjs'
            - '.github/scripts/validate-issue-forms.mjs'
            - '.github/workflows/issue-forms.yml'
            - '.github/labels.yml'
    push:
        branches:
            - master
            - main
        paths:
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/scripts/issue-form-rules.mjs'
            - '.github/scripts/issue-forms.mjs'
            - '.github/scripts/validate-issue-forms.mjs'
            - '.github/workflows/issue-forms.yml'
            - '.github/labels.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        name: 📝 Validate issue forms
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: ⚙️ Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: 🔧 Setup Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: 📦 Install validator dependency
              run: pnpm install --filter pumpkin-plugins --frozen-lockfile --ignore-scripts

            - name: ✅ Validate issue form definitions
              run: node .github/scripts/validate-issue-forms.mjs
