name: Actions

on:
    workflow_call:
        inputs:
            actions:
                description: JSON array of action suites selected by CI
                required: true
                type: string
        secrets:
            CODECOV_TOKEN:
                required: false

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    test:
        name: 🧪 Test ${{ matrix.action }}
        if: inputs.actions != '[]'
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix:
                action: ${{ fromJSON(inputs.actions) }}
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 📋 Lint action code
              id: lint-action-code
              env:
                  ACTION_NAME: ${{ matrix.action }}
              run: node scripts/ci-run.mjs "Action lint" -- pnpm exec biome check "actions/$ACTION_NAME/"

            - name: 🧪 Test action
              id: test-action
              env:
                  ACTION_NAME: ${{ matrix.action }}
              run: node scripts/ci-run.mjs "Action tests with coverage" -- pnpm exec c8 --reporter=lcov --reporter=text --reports-dir=coverage/actions node --test actions/"$ACTION_NAME"/src/*.test.mjs

            - name: ☂️ Upload action coverage
              id: upload-action-coverage
              uses: codecov/codecov-action@v7.1.1
              with:
                  directory: .
                  flags: tooling
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Action verification (${{ matrix.action }})
                  steps: ${{ toJSON(steps) }}
