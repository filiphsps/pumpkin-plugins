name: Actions

on:
    pull_request:
        paths:
            - 'actions/**'
    push:
        branches:
            - master
            - main
        paths:
            - 'actions/**'

concurrency:
    group: actions-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    changes:
        name: 🔍 Changed actions
        timeout-minutes: 5
        runs-on: ubuntu-24.04
        outputs:
            actions: ${{ steps.classify.outputs.actions_to_test }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 🔍 Find changed action code
              id: classify
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/changed-areas.mjs "$BASE" "$HEAD"

    test:
        name: 🧪 Test ${{ matrix.action }}
        needs: [changes]
        if: needs.changes.outputs.actions != '[]'
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                action: ${{ fromJSON(needs.changes.outputs.actions) }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📋 Lint action code
              env:
                  ACTION_NAME: ${{ matrix.action }}
              run: pnpm exec biome check "actions/$ACTION_NAME/"

            - name: 🧪 Test action
              env:
                  ACTION_NAME: ${{ matrix.action }}
              run: node --test actions/"$ACTION_NAME"/src/*.test.mjs
