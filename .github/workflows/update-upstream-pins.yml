name: Update upstream pins

on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

concurrency:
    group: upstream-pins-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    discover:
        name: 🔎 Check upstream pins
        runs-on: ubuntu-26.04
        outputs:
            matrix: ${{ steps.pins.outputs.matrix }}
        steps:
            - name: 🕶️ Checkout default branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: 🟢 Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version

            # Discovery only needs the root package's dependencies, such as commander.
            - name: 📥 Install root dependencies
              run: pnpm install --frozen-lockfile --filter pumpkin-plugins

            - name: 🔎 Discover upstream updates
              id: pins
              run: |
                  set -euo pipefail
                  matrix="$(node scripts/upstream-pins.mjs discover)"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    update:
        name: ${{ matrix.source.name }}
        needs: [discover]
        if: ${{ !github.event.repository.fork && needs.discover.outputs.matrix != '' }}
        strategy:
            fail-fast: false
            matrix:
                source: ${{ fromJSON(needs.discover.outputs.matrix).include }}
        concurrency:
            group: upstream-pin-${{ matrix.source.id }}
            cancel-in-progress: false
        timeout-minutes: 90
        runs-on: ubuntu-26.04
        env:
            GH_REPO: ${{ github.repository }}
            BASE_BRANCH: ${{ github.event.repository.default_branch }}
            SOURCE_ID: ${{ matrix.source.id }}
            SOURCE_NAME: ${{ matrix.source.name }}
            PIN_FILE: ${{ matrix.source.pinFile }}
            CURRENT_COMMIT: ${{ matrix.source.current }}
            LATEST_COMMIT: ${{ matrix.source.latest }}
            NEEDS_UPDATE: ${{ matrix.source.needsUpdate }}
            COMPARE_URL: ${{ matrix.source.compareUrl }}
            LABELS_JSON: ${{ toJSON(matrix.source.labels) }}
        steps:
            - name: 🔑 Create upstream pin update token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - name: 🕶️ Checkout default branch
              id: checkout-default-branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  token: ${{ steps.app-token.outputs.token }}

            - name: 🚀 Bootstrap
              id: bootstrap
              if: env.NEEDS_UPDATE == 'true'
              uses: ./.github/common/bootstrap

            - name: 📝 Update pinned source
              id: update-pinned-source
              if: env.NEEDS_UPDATE == 'true'
              run: node scripts/upstream-pins.mjs apply "$SOURCE_ID" "$LATEST_COMMIT"

            # Set up after the update so the Static Hermes cache key matches the new pin, as it does
            # in the pull request's CI.
            - name: 🔧 Setup Static Hermes toolchain
              id: setup-hermes
              if: env.NEEDS_UPDATE == 'true'
              uses: ./.github/common/setup-static-hermes

            - name: 🧪 Validate updated source
              id: validate
              if: env.NEEDS_UPDATE == 'true'
              continue-on-error: true
              run: node scripts/ci-run.mjs "Upstream source validation" -- node scripts/upstream-pins.mjs validate "$SOURCE_ID"

            - name: 🔄 Reconcile upstream update PR or issue
              id: reconcile-upstream-update-pr-or-issue
              if: always()
              env:
                  VALIDATION_RESULT: ${{ steps.validate.outcome }}
                  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: node scripts/upstream-pins.mjs reconcile

            - name: 📋 Upstream pin summary
              id: upstream-pin-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Upstream pin (${{ matrix.source.name }})
                  artifact-url: ${{ matrix.source.compareUrl }}
                  link-label: Compare upstream changes
                  facts: |
                      {
                        "Pin file": ${{ toJSON(matrix.source.pinFile) }},
                        "Current commit": ${{ toJSON(matrix.source.current) }},
                        "Latest commit": ${{ toJSON(matrix.source.latest) }},
                        "Update needed": ${{ toJSON(matrix.source.needsUpdate) }}
                      }
