name: CI

on:
    pull_request:
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/*/docs/**'
            - '!actions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'
    push:
        branches:
            - master
            - main
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/*/docs/**'
            - '!actions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'

concurrency:
    group: ci-${{ github.ref }}
    # Let push runs finish: release-please must not be interrupted between creating a tag
    # and updating its release PR. Pull request runs can still be superseded safely.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    changes:
        name: 🔍 Changed files
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        outputs:
            code: ${{ steps.classify.outputs.code }}
            actions: ${{ steps.classify.outputs.actions }}
            actions_to_test: ${{ steps.classify.outputs.actions_to_test }}
            generated_readmes: ${{ steps.classify.outputs.generated_readmes }}
            integration_scope: ${{ steps.classify.outputs.integration_scope }}
            integration_extra: ${{ steps.classify.outputs.integration_extra }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  # Diffing against the base needs the history behind it, not just the one commit.
                  fetch-depth: 0

            - name: 📥 Fetch comparison base
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: git fetch --no-tags origin "$BASE"

            # Everything else keys off this: a change that touches only documentation can't break a
            # build, a test or a plugin, so it skips the jobs that would tell us otherwise.
            - name: 🔍 What the change touches
              id: classify
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/changed-areas.mjs "$BASE" "$HEAD"

    commits:
        name: 💬 Commit messages
        needs: [changes]
        if: >-
            ${{
              github.event_name == 'pull_request' &&
              (
                needs.changes.outputs.code == 'true' ||
                needs.changes.outputs.actions != '[]' ||
                needs.changes.outputs.actions_to_test != '[]' ||
                needs.changes.outputs.generated_readmes == 'true'
              )
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 💬 Lint commits
              uses: wagoid/commitlint-github-action@v6.2.1
              with:
                  configFile: commitlint.config.mjs

    lint:
        name: 📋 Lint
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📋 Lint
              run: pnpm run lint

    typecheck:
        name: ✅ Typecheck
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: ✅ Typecheck
              run: pnpm run typecheck

    runtime-provenance:
        name: 🔐 Runtime provenance
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 45
        runs-on: macos-15
        permissions:
            contents: read
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 🔍 Select runtime inputs
              id: scope
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  changed=$(git diff --name-only "$BASE" "$HEAD" -- \
                    tools/build/runtime tools/build/src/runtime-provenance.test.ts \
                    tools/build/src/runtime-ci.test.ts .github/workflows/ci.yml)
                  if [ -n "$changed" ]; then
                    echo 'required=true' >> "$GITHUB_OUTPUT"
                  else
                    echo 'required=false' >> "$GITHUB_OUTPUT"
                  fi

            - name: 🚀 Bootstrap
              if: steps.scope.outputs.required == 'true'
              uses: ./.github/common/bootstrap

            - name: 🔐 Rebuild and verify pinned runtime twice
              id: verify
              if: steps.scope.outputs.required == 'true'
              env:
                  RUNTIME_PROBE_ROOT: ${{ runner.temp }}/runtime-provenance
              run: |
                  set -eu
                  mkdir -p "$RUNTIME_PROBE_ROOT/sdk"
                  rustup toolchain install 1.99.0 --profile minimal --target wasm32-wasip2
                  export PATH="$(dirname "$(rustup which --toolchain 1.99.0 rustc)"):$PATH"
                  curl --fail --location --retry 3 \
                    https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-arm64-macos.tar.gz \
                    --output "$RUNTIME_PROBE_ROOT/sdk.tar.gz"
                  printf '%s  %s\n' \
                    9c59398106b417f8f14913380fdf0097a8cc0ff4af9eb3ce0065a859e88d49e9 \
                    "$RUNTIME_PROBE_ROOT/sdk.tar.gz" | shasum -a 256 -c
                  tar -xzf "$RUNTIME_PROBE_ROOT/sdk.tar.gz" -C "$RUNTIME_PROBE_ROOT/sdk" --strip-components=1
                  node tools/build/runtime/provenance.mjs verify tools/build/runtime
                  for attempt in a b; do
                    source_dir="$RUNTIME_PROBE_ROOT/source-$attempt"
                    git init -q "$source_dir"
                    git -C "$source_dir" remote add origin https://github.com/andreiltd/componentize-qjs.git
                    git -C "$source_dir" fetch --depth=1 origin e563c6d6ae50b087980414015663ca9c948c09bb
                    git -C "$source_dir" checkout --detach FETCH_HEAD
                    QJS_SOURCE_DIR="$source_dir" \
                    WASI_SDK_PATH="$RUNTIME_PROBE_ROOT/sdk" \
                    CARGO_TARGET_DIR="$RUNTIME_PROBE_ROOT/target-$attempt" \
                    RUNTIME_OUTPUT_DIR="$RUNTIME_PROBE_ROOT/candidate-$attempt" \
                      sh tools/build/runtime/build.sh
                    node tools/build/runtime/provenance.mjs verify-candidate "$RUNTIME_PROBE_ROOT/candidate-$attempt"
                  done
                  candidate_a="$RUNTIME_PROBE_ROOT/candidate-a/quickjs-runtime-bigint.wasm"
                  candidate_b="$RUNTIME_PROBE_ROOT/candidate-b/quickjs-runtime-bigint.wasm"
                  hash_a=$(shasum -a 256 "$candidate_a" | cut -d ' ' -f 1)
                  hash_b=$(shasum -a 256 "$candidate_b" | cut -d ' ' -f 1)
                  printf 'Runtime build A SHA-256: %s\nRuntime build B SHA-256: %s\n' "$hash_a" "$hash_b"
                  if ! cmp -s "$candidate_a" "$candidate_b"; then
                    echo 'Isolated runtime builds differ on this runner' >&2
                    exit 1
                  fi

            - name: 🎃 Test candidate runtime on real Pumpkin
              id: integration
              if: steps.scope.outputs.required == 'true'
              env:
                  RUNTIME_PROBE_ROOT: ${{ runner.temp }}/runtime-provenance
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs
              run: |
                  cp "$RUNTIME_PROBE_ROOT/candidate-a/quickjs-runtime-bigint.wasm" \
                    tools/build/runtime/quickjs-runtime-bigint.wasm
                  pnpm exec turbo run test:integration --concurrency=4 --force \
                    --filter=...@pumpkin-plugins/apple-skin-pumpkin \
                    --filter=...@pumpkin-plugins/bedrock-addon-manager \
                    --filter=...@pumpkin-plugins/distant-horizons-support-pumpkin \
                    --filter=...@pumpkin-plugins/dynamic-lights-pumpkin \
                    --filter=...@pumpkin-plugins/upnpumpkin \
                    --filter=...@pumpkin-plugins/waypoints

            - name: 📤 Upload server logs
              if: failure() && steps.scope.outputs.required == 'true'
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: runtime-pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

    test:
        name: 🧪 Test
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🧪 Unit tests with coverage
              run: pnpm run coverage

            - name: ☂️ Upload coverage
              uses: codecov/codecov-action@v7.1.1
              with:
                  directory: .
                  flags: unittests
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: 🧪 Script tests
              run: pnpm run test:scripts

    action-tests:
        name: 🧪 Action tests
        needs: [changes]
        if: needs.changes.outputs.actions_to_test != '[]'
        uses: ./.github/workflows/actions.yml
        with:
            actions: ${{ needs.changes.outputs.actions_to_test }}
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    action-gate:
        name: 🛡️ Action test gate
        needs: [changes, action-tests]
        if: ${{ always() }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🛡️ Require selected action suites to pass
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  ACTIONS: ${{ needs.changes.outputs.actions_to_test }}
                  TEST_RESULT: ${{ needs['action-tests'].result }}
              run: |
                  if [[ "$CHANGES_RESULT" != 'success' ]]; then
                      echo 'Change classification failed.' >&2
                      exit 1
                  fi
                  if [[ "$ACTIONS" == '[]' && "$TEST_RESULT" == 'skipped' ]]; then
                      exit 0
                  fi
                  if [[ "$ACTIONS" != '[]' && "$TEST_RESULT" == 'success' ]]; then
                      exit 0
                  fi
                  echo "Required action verification did not pass: $TEST_RESULT" >&2
                  exit 1

    docs:
        name: 📝 Docs and config
        needs: [changes]
        if: >-
            ${{
              needs.changes.outputs.code == 'true' ||
              needs.changes.outputs.actions != '[]' ||
              needs.changes.outputs.actions_to_test != '[]' ||
              needs.changes.outputs.generated_readmes == 'true'
            }}
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Generated READMEs are current
              run: pnpm run readme:check

            # Release config, package metadata, and hand-written docs against the code.
            - name: 🏷️ Repo checks
              run: pnpm run check

    build:
        name: 🔨 Build
        needs: [changes, lint, typecheck]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 25
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔨 Build All
              run: pnpm run build

            # Fork PRs cannot access repository secrets. Sign their CI artifacts with a run-only
            # key so the build and integration artifacts are always signed without exposing the
            # repository release key.
            - name: 🔏 Prepare signing key
              env:
                  PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
              run: |
                  PLUGIN_SIGNING_KEY="$(printf '%s' "$PLUGIN_SIGNING_KEY" | tr -d '[:space:]')"
                  if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$PLUGIN_SIGNING_KEY" ]; then
                      PLUGIN_SIGNING_KEY="$(node --input-type=module -e 'import { generateKeyPair } from "@pumpkin-plugins/signing"; process.stdout.write(generateKeyPair().secretKeyHex);')"
                      echo "::add-mask::$PLUGIN_SIGNING_KEY"
                      echo "::warning title=Ephemeral signing key::This run uses a run-only key; its signed artifacts are for CI and cannot be published."
                  fi
                  echo "PLUGIN_SIGNING_KEY=$PLUGIN_SIGNING_KEY" >> "$GITHUB_ENV"

            - name: 📦 Collect plugin artifacts
              run: node scripts/collect-plugins.mjs --manifest "$RUNNER_TEMP/plugins.json"

            - name: 🔏 Sign collected plugins
              uses: ./actions/sign-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  developer-name: Filiph Sandström
                  signing-key: ${{ env.PLUGIN_SIGNING_KEY }}

            - name: 🔑 Resolve signing public key
              id: signing-key
              run: |
                  node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
                  import { publicKeyOf } from "@pumpkin-plugins/signing";
                  console.log(`public-key=${publicKeyOf(process.env.PLUGIN_SIGNING_KEY)}`);
                  NODE

            - name: ✅ Verify signed plugin artifacts
              uses: ./actions/verify-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  expected-public-key: ${{ steps.signing-key.outputs.public-key }}

            - name: 🔎 Install verified signed plugins for integration tests
              run: node scripts/install-signed-plugin-builds.mjs

            - name: 📦 Upload build artifact
              id: upload-signed-plugins
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugins
                  path: dist/

            - name: 📝 Add signed plugins to the job summary
              env:
                  ARTIFACT_URL: ${{ steps.upload-signed-plugins.outputs.artifact-url }}
              run: |
                  {
                      echo "### Signed plugin artifacts"
                      echo
                      echo "[Download signed plugin files]($ARTIFACT_URL)"
                      echo
                      echo "Available for one day."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: 📦 Upload plugin builds for integration tests
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugin-wasm
                  path: packages/*/build/*.wasm

            - name: 📦 Upload update-check fixture
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: update-check-fixture
                  path: tools/update-check/build/update-check-fixture.wasm

    integration:
        name: 🎃 Integration (real Pumpkin)
        needs: [changes, build]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📥 Download plugin builds
              uses: actions/download-artifact@v8.0.2
              with:
                  name: plugin-wasm
                  path: packages/

            - name: 📥 Download update-check fixture
              uses: actions/download-artifact@v8.0.2
              with:
                  name: update-check-fixture
                  path: tools/update-check/build/

            - name: 🎃 Integration tests
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  INTEGRATION_SCOPE: ${{ needs.changes.outputs.integration_scope }}
                  INTEGRATION_EXTRA: ${{ needs.changes.outputs.integration_extra }}
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs
              run: |
                  if [ "$INTEGRATION_SCOPE" = affected ]; then
                      filters=(--filter="...[$BASE_SHA]")
                      if [ -n "$INTEGRATION_EXTRA" ]; then
                          filters+=(--filter="$INTEGRATION_EXTRA")
                      fi
                      pnpm exec turbo run test:integration --concurrency=4 --only "${filters[@]}"
                  else
                      pnpm exec turbo run test:integration --concurrency=4 --only
                  fi

            - name: 📤 Upload server logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

    generator:
        name: 🧬 Generator
        needs: [changes, lint]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            # A throwaway plugin proves the templates still produce something that builds and loads.
            - name: 🧬 Generate a sample plugin
              run: pnpm gen --args ci-sample CiSample "Generator smoke test"

            - name: 🧬 Generate a sample action
              run: pnpm gen:action --args ci-sample-action "CI Sample Action" "Generator smoke test action"

            - name: 🏷️ It is registered and documented
              run: |
                  pnpm run check
                  pnpm run readme:check

            - name: 🧪 Test the generated action
              run: node --test actions/ci-sample-action/src/*.test.mjs

            - name: 🎃 Typecheck, build and load it on a real Pumpkin
              run: pnpm exec turbo run typecheck build test:integration --filter=@pumpkin-plugins/ci-sample
              env:
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs

            - name: 📤 Upload server logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: generator-pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

    release:
        name: 🚢 Release
        needs: [changes, build, test, docs, integration, action-gate, runtime-provenance]
        if: >-
            ${{
              always() &&
              github.event_name == 'push' &&
              needs.changes.result == 'success' &&
              needs.docs.result == 'success' &&
              needs['action-gate'].result == 'success' &&
              (
                (
                  needs.changes.outputs.code == 'true' &&
                  needs['runtime-provenance'].result == 'success' &&
                  needs.build.result == 'success' &&
                  needs.test.result == 'success' &&
                  needs.integration.result == 'success'
                ) ||
                (
                  needs.changes.outputs.code != 'true' &&
                  needs.changes.outputs.actions != '[]'
                )
              )
            }}
        permissions:
            contents: write
        uses: ./.github/workflows/release.yml
        secrets: inherit

    cleanup:
        name: 🧹 Cleanup artifacts
        needs: [build, integration, release]
        if: >-
            ${{
              always() &&
              needs.build.result == 'success' &&
              (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
              (needs.release.result == 'success' || needs.release.result == 'skipped') &&
              (
                github.event_name != 'pull_request' ||
                (
                  github.actor != 'dependabot[bot]' &&
                  github.event.pull_request.head.repo.full_name == github.repository
                )
              )
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        permissions:
            actions: write
        steps:
            - name: 🧹 Delete artifacts after their last consumer
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  artifact_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                      --jq '.artifacts[] | select(.name == "plugin-wasm" or .name == "update-check-fixture" or (.name | startswith("release-"))) | .id')"
                  if [ -z "$artifact_ids" ]; then
                      echo "No temporary artifacts to delete"
                      exit 0
                  fi
                  while IFS= read -r artifact_id; do
                      [ -z "$artifact_id" ] && continue
                      gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
                      echo "Deleted temporary artifact $artifact_id"
                  done <<< "$artifact_ids"
