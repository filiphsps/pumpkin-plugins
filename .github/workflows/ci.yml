name: CI

on:
    pull_request:
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/**/docs/**'
            - '!actions/*/docs/**'
            - '!extensions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!.github/workflows/actionlint.yml'
            - '!.github/actionlint.yaml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'
            - 'extensions/*/README.md'
            - 'native/*/README.md'
    push:
        branches:
            - master
            - main
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/**/docs/**'
            - '!actions/*/docs/**'
            - '!extensions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!.github/workflows/actionlint.yml'
            - '!.github/actionlint.yaml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'
            - 'extensions/*/README.md'
            - 'native/*/README.md'
            # Docs-only default-branch pushes still need release processing to refresh open release
            # PRs and catch up any releases from an earlier run that did not finish.
            - '**/*.md'
            - 'docs/**'
            - 'packages/*/docs/**'
            - 'tools/**/docs/**'
            - 'actions/*/docs/**'
            - 'extensions/*/docs/**'
            - 'LICENSE'
    workflow_dispatch:
        inputs:
            release_commit:
                description: Full commit SHA of an existing release to recover for npm publication
                required: true
                type: string

concurrency:
    group: ci-${{ github.ref }}
    # Let push runs finish: release-please must not be interrupted between creating a tag
    # and updating its release PR. Pull request runs can still be superseded safely.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    changes:
        name: 🔍 Changed files
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        outputs:
            code: ${{ steps.classify.outputs.code }}
            native: ${{ steps.classify.outputs.native }}
            config_only: ${{ steps.label-config-scope.outputs.config_only }}
            skip_expensive_checks: ${{ steps.release-commits.outputs.skip_expensive_checks }}
            actions: ${{ steps.classify.outputs.actions }}
            actions_to_test: ${{ steps.classify.outputs.actions_to_test }}
            extensions: ${{ steps.classify.outputs.extensions }}
            extensions_to_test: ${{ steps.classify.outputs.extensions_to_test }}
            generated_readmes: ${{ steps.classify.outputs.generated_readmes }}
            generator: ${{ steps.classify.outputs.generator }}
            integration_scope: ${{ steps.classify.outputs.integration_scope }}
            integration_extra: ${{ steps.classify.outputs.integration_extra }}
            integration_packages: ${{ steps.classify.outputs.integration_packages }}
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1
              with:
                  # Diffing against the base needs the history behind it, not just the one commit.
                  fetch-depth: 0

            - name: 📥 Fetch comparison base
              id: fetch-comparison-base
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
              run: git fetch --no-tags origin "$BASE"

            - name: 🧭 Check whether the change only updates label configuration
              id: label-config-scope
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/changed-areas.mjs --config-only "$BASE" "$HEAD"

            - name: 🧮 Identify release-only push commits
              id: release-commits
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF: ${{ github.ref }}
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  set -euo pipefail
                  skip_expensive_checks=false
                  if [[ "$EVENT_NAME" == 'push' && "$REF" == 'refs/heads/master' ]]; then
                      subjects="$(git log --format=%s "$BASE..$HEAD")"
                      if [[ -n "$subjects" ]]; then
                          skip_expensive_checks=true
                          has_release_commit=false
                          while IFS= read -r subject; do
                              case "$subject" in
                                  'chore(master): release '*|'chore: retire first-release pins')
                                      has_release_commit=true
                                      ;;
                                  'docs: update generated READMEs')
                                      ;;
                                  *)
                                      skip_expensive_checks=false
                                      break
                                      ;;
                              esac
                          done <<< "$subjects"
                          if [[ "$has_release_commit" != true ]]; then
                              skip_expensive_checks=false
                          fi
                      fi
                  fi
                  printf 'skip_expensive_checks=%s\n' "$skip_expensive_checks" >> "$GITHUB_OUTPUT"

            # Everything else keys off this: a change that touches only documentation can't break a
            # build, a test or a plugin, so it skips the jobs that would tell us otherwise.
            - name: 🔍 What the change touches
              id: classify
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/changed-areas.mjs "$BASE" "$HEAD"

            - name: 📋 Selected checks
              id: selected-checks
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Selected CI checks
                  steps: ${{ toJSON(steps) }}
                  facts: ${{ toJSON(steps.classify.outputs) }}

    commits:
        name: 💬 Commit messages
        needs: [changes]
        if: >-
            ${{
              github.event_name == 'pull_request' &&
              (
                needs.changes.outputs.code == 'true' ||
                needs.changes.outputs.actions != '[]' ||
                needs.changes.outputs.actions_to_test != '[]' ||
                needs.changes.outputs.extensions != '[]' ||
                needs.changes.outputs.extensions_to_test != '[]' ||
                needs.changes.outputs.generated_readmes == 'true'
              )
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 💬 Lint commits
              uses: wagoid/commitlint-github-action@v6.2.1
              with:
                  configFile: commitlint.config.mjs

    lint:
        name: 📋 Lint
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 📋 Lint
              id: lint
              run: node scripts/ci-run.mjs "Repository lint" -- pnpm run lint

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Repository lint
                  steps: ${{ toJSON(steps) }}

    typecheck:
        name: ✅ Typecheck
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: ✅ Typecheck
              id: typecheck
              run: node scripts/ci-run.mjs "Workspace typecheck" -- pnpm run typecheck

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Workspace typecheck
                  steps: ${{ toJSON(steps) }}

    test:
        name: 🧪 Test
        needs: [changes]
        if: >-
            ${{
              (needs.changes.outputs.code == 'true' || needs.changes.outputs.actions_to_test != '[]') &&
              needs.changes.outputs.skip_expensive_checks != 'true'
            }}
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🧪 Behavior tests with coverage
              id: unit-tests-with-coverage
              run: node scripts/ci-run.mjs "Behavior tests and process coverage" -- pnpm run coverage

            - name: ☂️ Upload coverage
              id: upload-coverage
              uses: codecov/codecov-action@v7.1.1
              with:
                  directory: .
                  flags: tooling,guest
                  exclude: coverage/verification,coverage/process/raw
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: 📦 Preserve coverage evidence
              id: preserve-coverage-evidence
              if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: coverage-evidence
                  retention-days: 7
                  if-no-files-found: error
                  path: |
                      coverage/process/
                      !coverage/process/raw/
                      coverage/verification/
                      tools/**/coverage/lcov.info
                      packages/*/coverage/lcov.info

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Behavior tests and coverage
                  steps: ${{ toJSON(steps) }}
                  tests: 'true'

    action-tests:
        name: 🧪 Action tests
        needs: [changes]
        if: needs.changes.outputs.actions_to_test != '[]'
        uses: ./.github/workflows/actions.yml
        with:
            actions: ${{ needs.changes.outputs.actions_to_test }}
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    action-gate:
        name: 🛡️ Action test gate
        needs: [changes, action-tests]
        if: >-
            ${{
              always() &&
              needs.changes.outputs.config_only != 'true' &&
              !startsWith(github.head_ref, 'release-please--branches--')
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🛡️ Require selected action suites to pass
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  ACTIONS: ${{ needs.changes.outputs.actions_to_test }}
                  TEST_RESULT: ${{ needs['action-tests'].result }}
              run: |
                  if [[ "$CHANGES_RESULT" != 'success' ]]; then
                      echo 'Change classification failed.' >&2
                      exit 1
                  fi
                  if [[ "$ACTIONS" == '[]' && "$TEST_RESULT" == 'skipped' ]]; then
                      exit 0
                  fi
                  if [[ "$ACTIONS" != '[]' && "$TEST_RESULT" == 'success' ]]; then
                      exit 0
                  fi
                  echo "Required action verification did not pass: $TEST_RESULT" >&2
                  exit 1

    extension-tests:
        name: 🧪 Extension tests
        needs: [changes]
        if: needs.changes.outputs.extensions_to_test != '[]'
        uses: ./.github/workflows/extensions.yml
        with:
            extensions: ${{ needs.changes.outputs.extensions_to_test }}

    extension-gate:
        name: 🛡️ Extension test gate
        needs: [changes, extension-tests]
        if: >-
            ${{
              always() &&
              needs.changes.outputs.config_only != 'true' &&
              !startsWith(github.head_ref, 'release-please--branches--')
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🛡️ Require selected extension suites to pass
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  EXTENSIONS: ${{ needs.changes.outputs.extensions_to_test }}
                  TEST_RESULT: ${{ needs['extension-tests'].result }}
              run: |
                  if [[ "$CHANGES_RESULT" != 'success' ]]; then
                      echo 'Change classification failed.' >&2
                      exit 1
                  fi
                  if [[ "$EXTENSIONS" == '[]' && "$TEST_RESULT" == 'skipped' ]]; then
                      exit 0
                  fi
                  if [[ "$EXTENSIONS" != '[]' && "$TEST_RESULT" == 'success' ]]; then
                      exit 0
                  fi
                  echo "Required extension verification did not pass: $TEST_RESULT" >&2
                  exit 1

    docs:
        name: 📝 Docs and config
        needs: [changes]
        if: >-
            ${{
              needs.changes.outputs.code == 'true' ||
              needs.changes.outputs.actions != '[]' ||
              needs.changes.outputs.actions_to_test != '[]' ||
              needs.changes.outputs.extensions != '[]' ||
              needs.changes.outputs.extensions_to_test != '[]' ||
              needs.changes.outputs.generated_readmes == 'true' ||
              (
                github.event_name == 'push' &&
                needs.changes.outputs.code != 'true' &&
                needs.changes.outputs.actions == '[]' &&
                needs.changes.outputs.actions_to_test == '[]' &&
                needs.changes.outputs.extensions == '[]' &&
                needs.changes.outputs.extensions_to_test == '[]' &&
                needs.changes.outputs.config_only != 'true'
              )
            }}
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Generated READMEs are current
              id: generated-readmes-are-current
              run: node scripts/ci-run.mjs "Generated documentation" -- pnpm run readme:check

            # Release config, package metadata, and hand-written docs against the code.
            - name: 🏷️ Repo checks
              id: repo-checks
              run: node scripts/ci-run.mjs "Repository metadata and docs" -- pnpm run check

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Documentation and configuration
                  steps: ${{ toJSON(steps) }}

    build:
        name: 🔨 Build
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔧 Setup Static Hermes toolchain
              id: setup-hermes
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Prepare Static Hermes
              id: prepare-hermes
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            - name: 💾 Save Static Hermes build cache
              id: save-static-hermes-build-cache
              if: steps.prepare-hermes.outcome == 'success'
              uses: actions/cache/save@v6.1.0
              with:
                  path: ${{ github.workspace }}/.cache/hermes
                  key: ${{ steps.setup-hermes.outputs.hermes-cache-key }}

            - name: 🔨 Build All
              id: build-all
              run: node scripts/ci-run.mjs "Build production components" -- pnpm run build

            - name: 🔬 Run Static Hermes integration test
              id: run-static-hermes-integration-test
              run: node scripts/ci-run.mjs "Static Hermes smoke test" -- pnpm turbo run test:integration --filter=@pumpkin-plugins/apple-skin-pumpkin

            - name: 📦 Build release artifacts
              id: build-release-artifacts
              run: node scripts/ci-run.mjs "Build release components" -- pnpm run build

            # Fork PRs cannot access repository secrets. Sign their CI artifacts with a run-only
            # key so the build and integration artifacts are always signed without exposing the
            # repository release key.
            - name: 🔏 Prepare signing key
              id: prepare-signing-key
              env:
                  PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
              run: |
                  PLUGIN_SIGNING_KEY="$(printf '%s' "$PLUGIN_SIGNING_KEY" | tr -d '[:space:]')"
                  if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$PLUGIN_SIGNING_KEY" ]; then
                      PLUGIN_SIGNING_KEY="$(node --input-type=module -e 'import { generateKeyPair } from "@pumpkin-plugins/signing"; process.stdout.write(generateKeyPair().secretKeyHex);')"
                      echo "::add-mask::$PLUGIN_SIGNING_KEY"
                      echo "signing-mode=Signing key: run-only CI key; these artifacts cannot be published." >> "$GITHUB_OUTPUT"
                  else
                      echo "signing-mode=Signing key: repository release key." >> "$GITHUB_OUTPUT"
                  fi
                  echo "PLUGIN_SIGNING_KEY=$PLUGIN_SIGNING_KEY" >> "$GITHUB_ENV"

            - name: 📦 Collect plugin artifacts
              id: collect-plugin-artifacts
              run: node scripts/collect-plugins.mjs --manifest "$RUNNER_TEMP/plugins.json"

            - name: 🔏 Sign collected plugins
              id: sign-collected-plugins
              uses: ./actions/sign-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  developer-name: Filiph Sandström
                  signing-key: ${{ env.PLUGIN_SIGNING_KEY }}

            - name: 🔑 Resolve signing public key
              id: signing-key
              run: |
                  node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
                  import { publicKeyOf } from "@pumpkin-plugins/signing";
                  console.log(`public-key=${publicKeyOf(process.env.PLUGIN_SIGNING_KEY)}`);
                  NODE

            - name: ✅ Verify signed plugin artifacts
              id: verify-signed-plugin-artifacts
              uses: ./actions/verify-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  expected-public-key: ${{ steps.signing-key.outputs.public-key }}

            - name: 🔎 Install verified signed plugins for integration tests
              id: install-verified-signed-plugins-for-integration-tests
              run: node scripts/install-signed-plugin-builds.mjs

            - name: 📦 Upload build artifact
              id: upload-signed-plugins
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugins
                  path: dist/

            - name: 📦 Upload plugin builds for integration tests
              id: upload-plugin-builds-for-integration-tests
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugin-wasm
                  path: packages/*/build/*.wasm

            - name: 📦 Upload update-check fixture
              id: upload-update-check-fixture
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: update-check-fixture
                  path: tools/update-check/build/update-check-fixture.wasm

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Plugin build
                  steps: ${{ toJSON(steps) }}
                  artifact-url: ${{ steps.upload-signed-plugins.outputs.artifact-url }}
                  link-label: Download signed plugins and SHA-256 checksums
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  note: ${{ steps.prepare-signing-key.outputs.signing-mode }} Artifacts expire after one day.

    external-consumer:
        name: 📦 External consumer
        needs: [changes]
        if: >-
            ${{
              needs.changes.outputs.code == 'true' &&
              needs.changes.outputs.skip_expensive_checks != 'true'
            }}
        uses: ./.github/workflows/external-consumer.yml

    engine-comparison:
        name: 📊 Engine comparison
        needs: [changes, build]
        if: >-
            ${{
              needs.changes.outputs.code == 'true' &&
              needs.changes.outputs.skip_expensive_checks != 'true'
            }}
        uses: ./.github/workflows/engine-comparison.yml

    integration:
        name: 🎃 Integration (real Pumpkin)
        needs: [changes, build]
        if: >-
            ${{
              needs.changes.outputs.skip_expensive_checks != 'true' &&
              (
                needs.changes.outputs.integration_scope == 'affected' ||
                needs.changes.outputs.integration_scope == 'all'
              )
            }}
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔧 Restore Static Hermes toolchain
              id: restore-static-hermes-toolchain
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Verify Static Hermes is prepared
              id: verify-static-hermes-is-prepared
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            - name: 📥 Download plugin builds
              id: download-plugin-builds
              uses: actions/download-artifact@v8.0.2
              with:
                  name: plugin-wasm
                  path: packages/

            - name: 📥 Download update-check fixture
              id: download-update-check-fixture
              uses: actions/download-artifact@v8.0.2
              with:
                  name: update-check-fixture
                  path: tools/update-check/build/

            - name: 🏗️ Build plugin CLI for isolated integration tests
              id: build-plugin-cli-for-isolated-integration-tests
              run: pnpm turbo run build --filter=@pumpkin-plugins/build

            - name: 🎃 Integration tests
              id: integration-tests
              env:
                  INTEGRATION_SCOPE: ${{ needs.changes.outputs.integration_scope }}
                  INTEGRATION_EXTRA: ${{ needs.changes.outputs.integration_extra }}
                  INTEGRATION_PACKAGES: ${{ needs.changes.outputs.integration_packages || '[]' }}
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs
              run: |
                  node scripts/ci-run.mjs "Selected real-server integration suites" -- bash -euo pipefail <<'CI_CHECK'
                  if [ "$INTEGRATION_SCOPE" = affected ]; then
                      if [ "$INTEGRATION_PACKAGES" = '[]' ]; then
                          echo 'Affected integration scope has no package filters.' >&2
                          exit 1
                      fi
                      filters=()
                      while IFS= read -r package; do
                          filters+=(--filter="...$package")
                      done < <(node -e 'for (const name of JSON.parse(process.env.INTEGRATION_PACKAGES)) console.log(name)')
                      if [ -n "$INTEGRATION_EXTRA" ]; then
                          filters+=(--filter="$INTEGRATION_EXTRA")
                      fi
                      pnpm turbo run test:integration --concurrency=2 --only "${filters[@]}"
                  else
                      pnpm turbo run test:integration --concurrency=2 --only
                  fi
                  CI_CHECK

            - name: 📤 Upload server logs
              id: upload-server-logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Real-server integration tests
                  steps: ${{ toJSON(steps) }}
                  tests: 'true'

    integration-gate:
        name: 🛡️ Integration gate
        needs: [changes, integration]
        if: >-
            ${{
              always() &&
              needs.changes.outputs.config_only != 'true' &&
              !startsWith(github.head_ref, 'release-please--branches--')
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🛡️ Require integration tests when relevant changes are selected
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  INTEGRATION_SCOPE: ${{ needs.changes.outputs.integration_scope }}
                  SKIP_EXPENSIVE_CHECKS: ${{ needs.changes.outputs.skip_expensive_checks }}
                  INTEGRATION_RESULT: ${{ needs.integration.result }}
              run: |
                  if [[ "$CHANGES_RESULT" != 'success' ]]; then
                      echo 'Change classification failed.' >&2
                      exit 1
                  fi
                  if [[ "$SKIP_EXPENSIVE_CHECKS" == 'true' && "$INTEGRATION_RESULT" == 'skipped' ]]; then
                      exit 0
                  fi
                  if [[ "$INTEGRATION_SCOPE" == 'none' || "$INTEGRATION_SCOPE" == 'benchmark' ]]; then
                      if [[ "$INTEGRATION_RESULT" == 'skipped' ]]; then
                          exit 0
                      fi
                  fi
                  if [[ ("$INTEGRATION_SCOPE" == 'affected' || "$INTEGRATION_SCOPE" == 'all') && "$INTEGRATION_RESULT" == 'success' ]]; then
                      exit 0
                  fi
                  echo "Required integration verification for scope $INTEGRATION_SCOPE did not pass: $INTEGRATION_RESULT" >&2
                  exit 1

    generator:
        name: 🧬 Generator
        # Build saves the prepared Static Hermes cache that this job restores.
        needs: [changes, lint, build]
        if: >-
            ${{
              needs.changes.outputs.generator == 'true' &&
              needs.changes.outputs.skip_expensive_checks != 'true'
            }}
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔧 Setup Static Hermes toolchain
              id: setup-static-hermes-toolchain
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Prepare Static Hermes
              id: prepare-static-hermes
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            # A throwaway plugin proves the templates still produce something that builds and loads.
            - name: 🧬 Generate a sample plugin
              id: generate-a-sample-plugin
              run: pnpm gen --args ci-sample CiSample "Generator smoke test"

            - name: 🧬 Generate a sample action
              id: generate-a-sample-action
              run: pnpm gen:action --args ci-sample-action "CI Sample Action" "Generator smoke test action"

            - name: 🧬 Generate a sample extension
              id: generate-a-sample-extension
              run: pnpm gen:extension --args ci-sample-extension "CI Sample Extension" "Generator smoke test extension"

            - name: 🏷️ It is registered and documented
              id: it-is-registered-and-documented
              run: |
                  pnpm run check
                  pnpm run readme:check

            - name: 🧪 Test the generated action
              id: test-the-generated-action
              run: node scripts/ci-run.mjs "Generated action tests" -- node --test actions/ci-sample-action/src/*.test.mjs

            - name: 🧪 Test and package the generated extension
              id: test-and-package-the-generated-extension
              run: |
                  node scripts/ci-run.mjs "Generated extension validation" -- bash -euo pipefail <<'CI_CHECK'
                  pnpm --filter ./extensions/ci-sample-extension run typecheck
                  pnpm --filter ./extensions/ci-sample-extension run test
                  pnpm --filter ./extensions/ci-sample-extension run build
                  pnpm --filter ./extensions/ci-sample-extension run package -- --out "$RUNNER_TEMP/ci-sample-extension.vsix"
                  CI_CHECK

            - name: 🎃 Typecheck, build and load it on a real Pumpkin
              id: typecheck-build-and-load-it-on-a-real-pumpkin
              run: |
                  node scripts/ci-run.mjs "Generated plugin typecheck, build and integration" -- bash -euo pipefail <<'CI_CHECK'
                  pnpm build --filter=@pumpkin-plugins/ci-sample
                  pnpm turbo run typecheck test:integration --filter=@pumpkin-plugins/ci-sample
                  CI_CHECK
              env:
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs

            - name: 📤 Upload server logs
              id: upload-server-logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: generator-pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Generator smoke tests
                  steps: ${{ toJSON(steps) }}
                  tests: 'true'

    generator-gate:
        name: 🛡️ Generator gate
        needs: [changes, generator]
        if: >-
            ${{
              always() &&
              needs.changes.outputs.config_only != 'true' &&
              !startsWith(github.head_ref, 'release-please--branches--')
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🛡️ Require the generator smoke test when selected
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  GENERATOR: ${{ needs.changes.outputs.generator }}
                  SKIP_EXPENSIVE_CHECKS: ${{ needs.changes.outputs.skip_expensive_checks }}
                  GENERATOR_RESULT: ${{ needs.generator.result }}
              run: |
                  if [[ "$CHANGES_RESULT" != 'success' ]]; then
                      echo 'Change classification failed.' >&2
                      exit 1
                  fi
                  if [[ "$SKIP_EXPENSIVE_CHECKS" == 'true' && "$GENERATOR_RESULT" == 'skipped' ]]; then
                      exit 0
                  fi
                  if [[ "$GENERATOR" != 'true' && "$GENERATOR_RESULT" == 'skipped' ]]; then
                      exit 0
                  fi
                  if [[ "$GENERATOR" == 'true' && "$GENERATOR_RESULT" == 'success' ]]; then
                      exit 0
                  fi
                  echo "Required generator verification did not pass: $GENERATOR_RESULT" >&2
                  exit 1

    native:
        name: 🦀 Native build and load tests
        needs: [changes]
        if: needs.changes.outputs.native == 'true' && needs.changes.outputs.skip_expensive_checks != 'true'
        uses: ./.github/workflows/native.yml
        permissions:
            contents: read

    native-gate:
        name: 🦀 Native gate
        needs: [changes, native]
        if: always() && needs.changes.result == 'success'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - name: Require selected native checks
              shell: bash
              env:
                  SELECTED: ${{ needs.changes.outputs.native }}
                  SKIP: ${{ needs.changes.outputs.skip_expensive_checks }}
                  RESULT: ${{ needs.native.result }}
              run: |
                  set -euo pipefail
                  if [[ "$RESULT" == success ]]; then exit 0; fi
                  if [[ ( "$SELECTED" != true || "$SKIP" == true ) && "$RESULT" == skipped ]]; then exit 0; fi
                  echo "Required native build/load tests did not pass: $RESULT" >&2
                  exit 1

    release:
        name: 🚢 Release
        needs: [changes, lint, typecheck, build, external-consumer, test, docs, integration-gate, action-gate, extension-gate, generator-gate, native-gate]
        if: >-
            ${{
              always() &&
              (
                (
                  github.event_name == 'workflow_dispatch' &&
                  github.ref == 'refs/heads/master' &&
                  inputs.release_commit != ''
                ) ||
                (
                  github.event_name == 'push' &&
                  needs.changes.result == 'success' &&
                  needs.docs.result == 'success' &&
                  needs['action-gate'].result == 'success' &&
                  needs['extension-gate'].result == 'success' &&
                  needs['integration-gate'].result == 'success' &&
                  needs['generator-gate'].result == 'success' &&
                  needs['native-gate'].result == 'success' &&
                  (
                    (
                      needs.changes.outputs.code == 'true' &&
                      needs.lint.result == 'success' &&
                      needs.typecheck.result == 'success' &&
                      needs.build.result == 'success' &&
                      (
                        needs['external-consumer'].result == 'success' ||
                        (
                          needs.changes.outputs.skip_expensive_checks == 'true' &&
                          needs['external-consumer'].result == 'skipped'
                        )
                      ) &&
                      (
                        needs.test.result == 'success' ||
                        (
                          needs.changes.outputs.skip_expensive_checks == 'true' &&
                          needs.test.result == 'skipped'
                        )
                      )
                    ) ||
                    (
                      needs.changes.outputs.code != 'true' &&
                      (
                        needs.changes.outputs.actions_to_test == '[]' ||
                        needs.test.result == 'success' ||
                        (
                          needs.changes.outputs.skip_expensive_checks == 'true' &&
                          needs.test.result == 'skipped'
                        )
                      ) &&
                      (
                        needs.changes.outputs.actions != '[]' ||
                        needs.changes.outputs.extensions != '[]' ||
                        (
                          needs.changes.outputs.actions_to_test == '[]' &&
                          needs.changes.outputs.extensions_to_test == '[]' &&
                          needs.changes.outputs.config_only != 'true'
                        )
                      )
                    )
                  )
                )
              )
            }}
        permissions:
            contents: write
            id-token: write
        uses: ./.github/workflows/release.yml
        with:
            release_commit: ${{ inputs.release_commit || '' }}
            tool_only: ${{ github.event_name == 'workflow_dispatch' }}
        secrets: inherit

    cleanup:
        name: 🧹 Cleanup artifacts
        needs: [changes, build, engine-comparison, integration, release]
        if: >-
            ${{
              always() &&
              needs.changes.outputs.config_only != 'true' &&
              !startsWith(github.head_ref, 'release-please--branches--') &&
              (
                github.event_name != 'pull_request' ||
                (
                  github.actor != 'dependabot[bot]' &&
                  github.event.pull_request.head.repo.full_name == github.repository
                )
              )
            }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        permissions:
            actions: write
        steps:
            - name: 🧹 Delete artifacts after their last consumer
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CLEAN_INTEGRATION_ARTIFACTS: ${{ needs.integration.result == 'success' || needs.integration.result == 'skipped' }}
                  CLEAN_RELEASE_ARTIFACTS: ${{ needs.release.result == 'success' }}
              run: |
                  artifact_records="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                      --jq '.artifacts[] | [.id, .name] | @tsv')"
                  if [ -z "$artifact_records" ]; then
                      echo "No temporary artifacts to delete"
                      exit 0
                  fi
                  while IFS=$'\t' read -r artifact_id artifact_name; do
                      [ -z "$artifact_id" ] && continue
                      case "$artifact_name" in
                          # The workflow_run commenter reads the report after CI finishes. SVGs live on the chart branch.
                          plugins|engine-comparison-report)
                              echo "Keeping $artifact_name for run history or benchmark comments"
                              continue
                              ;;
                          plugin-wasm|update-check-fixture)
                              if [ "$CLEAN_INTEGRATION_ARTIFACTS" != true ]; then
                                  echo "Keeping $artifact_name so the failed integration job can be retried"
                                  continue
                              fi
                              ;;
                          release-*)
                              if [ "$CLEAN_RELEASE_ARTIFACTS" != true ]; then
                                  echo "Keeping $artifact_name so the failed release can be retried"
                                  continue
                              fi
                              ;;
                          *)
                              continue
                              ;;
                      esac
                      gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
                      echo "Deleted $artifact_name artifact $artifact_id"
                  done <<< "$artifact_records"
