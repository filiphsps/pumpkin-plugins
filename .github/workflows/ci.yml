name: CI

on:
    pull_request:
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/**/docs/**'
            - '!actions/*/docs/**'
            - '!extensions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!.github/workflows/actionlint.yml'
            - '!.github/actionlint.yaml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'
            - 'extensions/*/README.md'
    push:
        branches:
            - master
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/**/docs/**'
            - '!actions/*/docs/**'
            - '!extensions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!.github/workflows/actionlint.yml'
            - '!.github/actionlint.yaml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'
            - 'extensions/*/README.md'
            # Docs-only default-branch pushes still need release processing to refresh open release
            # PRs and catch up any releases from an earlier run that did not finish.
            - '**/*.md'
            - 'docs/**'
            - 'packages/*/docs/**'
            - 'tools/**/docs/**'
            - 'actions/*/docs/**'
            - 'extensions/*/docs/**'
            - 'LICENSE'
    workflow_dispatch:
        inputs:
            release_commit:
                description: Full commit SHA of an existing release to recover for npm publication
                required: true
                type: string

concurrency:
    group: ci-${{ github.ref }}
    # Let push runs finish: release-please must not be interrupted between creating a tag
    # and updating its release PR. Pull request runs can still be superseded safely.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    changes:
        name: 🔍 Changed files
        if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        outputs:
            code: ${{ steps.classify.outputs.code }}
            config_only: ${{ steps.classify.outputs.config_only }}
            skip_expensive_checks: ${{ steps.classify.outputs.skip_expensive_checks }}
            actions: ${{ steps.classify.outputs.actions }}
            actions_to_test: ${{ steps.classify.outputs.actions_to_test }}
            extensions: ${{ steps.classify.outputs.extensions }}
            extensions_to_test: ${{ steps.classify.outputs.extensions_to_test }}
            generated_readmes: ${{ steps.classify.outputs.generated_readmes }}
            generator: ${{ steps.classify.outputs.generator }}
            integration_scope: ${{ steps.classify.outputs.integration_scope }}
            integration_packages: ${{ steps.classify.outputs.integration_packages }}
            external_consumer_full: ${{ steps.classify.outputs.external_consumer_full }}
            jobs: ${{ steps.select.outputs.jobs }}
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Diffing against the base needs the history behind it, not just the one commit.
                  # Commits and trees are enough; the few blobs read at the base are fetched on demand.
                  fetch-depth: 0
                  filter: blob:none

            - name: 📥 Fetch comparison base
              id: fetch-comparison-base
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
              run: git fetch --no-tags origin "$BASE"

            - name: 🟢 Setup Node
              id: setup-node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version

            # Everything else keys off this: a change that touches only documentation can't break a
            # build, a test or a plugin, so it skips the jobs that would tell us otherwise.
            - name: 🔍 What the change touches
              id: classify
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/changed-areas.mjs "$BASE" "$HEAD"

            # Every job's `if:` reads this selection, and ci-result checks results against it.
            - name: 🧭 Select CI jobs
              id: select
              env:
                  CHANGES: ${{ toJSON(steps.classify.outputs) }}
              run: node scripts/ci-gate.mjs select

            - name: 📋 Selected checks
              id: selected-checks
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Selected CI checks
                  facts: ${{ toJSON(steps.classify.outputs) }}

    commits:
        name: 💬 Commit messages
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs).commits
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 💬 Lint commits
              uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
              with:
                  configFile: commitlint.config.mjs

    lint:
        name: 📋 Lint
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs).lint
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 📋 Lint
              id: lint
              run: node scripts/ci-run.mjs "Repository lint" -- pnpm run lint

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Repository lint

    typecheck:
        name: ✅ Typecheck
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs).typecheck
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: ✅ Typecheck
              id: typecheck
              run: node scripts/ci-run.mjs "Workspace typecheck" -- pnpm run typecheck

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Workspace typecheck

    test:
        name: 🧪 Test
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs).test
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🧪 Behavior tests with coverage
              id: unit-tests-with-coverage
              run: node scripts/ci-run.mjs "Behavior tests and process coverage" -- pnpm run coverage

            - name: ☂️ Upload coverage
              id: upload-coverage
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  directory: .
                  flags: tooling,guest
                  exclude: coverage/verification,coverage/process/raw
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: 📦 Preserve coverage evidence
              id: preserve-coverage-evidence
              if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-evidence
                  retention-days: 7
                  if-no-files-found: error
                  path: |
                      coverage/process/
                      !coverage/process/raw/
                      coverage/verification/
                      tools/**/coverage/lcov.info
                      packages/*/coverage/lcov.info

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Behavior tests and coverage
                  tests: 'true'

    extension-tests:
        name: 🧪 Extension tests
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs)['extension-tests']
        uses: ./.github/workflows/extensions.yml
        with:
            extensions: ${{ needs.changes.outputs.extensions_to_test }}

    docs:
        name: 📝 Docs and config
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs).docs
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Generated READMEs are current
              id: generated-readmes-are-current
              run: node scripts/ci-run.mjs "Generated documentation" -- pnpm run readme:check

            # Release config, package metadata, and hand-written docs against the code.
            - name: 🏷️ Repo checks
              id: repo-checks
              run: node scripts/ci-run.mjs "Repository metadata and docs" -- pnpm run check

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Documentation and configuration

    build:
        name: 🔨 Build
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs).build
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔧 Setup Static Hermes toolchain
              id: setup-hermes
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Prepare Static Hermes
              id: prepare-hermes
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            # Integration and Generator restore this build later in the same run, so a pull request
            # that changes the toolchain saves it too. An exact hit has nothing new to save.
            - name: 💾 Save Static Hermes build cache
              id: save-static-hermes-build-cache
              if: steps.prepare-hermes.outcome == 'success' && steps.setup-hermes.outputs.hermes-cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ github.workspace }}/.cache/hermes
                  key: ${{ steps.setup-hermes.outputs.hermes-cache-key }}

            - name: 🔨 Build All
              id: build-all
              run: node scripts/ci-run.mjs "Build production components" -- pnpm run build
              env:
                  # Standalone builds only warn; the repository keeps every component under 5 MiB.
                  PUMPKIN_PLUGINS_FAIL_ON_SIZE_LIMIT: '1'

            # A quick check that a Static Hermes build loads on a real server before anything is
            # signed, even when the change selects no integration suites. The test only reads build/.
            - name: 🔬 Run Static Hermes integration test
              id: run-static-hermes-integration-test
              run: node scripts/ci-run.mjs "Static Hermes smoke test" -- pnpm turbo run test:integration --filter=@pumpkin-plugins/apple-skin-pumpkin

            # The release workflow signs every published asset again with the repository key, so CI
            # signs with a run-only key and never puts the release key in this job's environment.
            - name: 🔏 Prepare signing key
              id: prepare-signing-key
              run: |
                  PLUGIN_SIGNING_KEY="$(node --input-type=module -e 'import { generateKeyPair } from "@pumpkin-plugins/signing"; process.stdout.write(generateKeyPair().secretKeyHex);')"
                  echo "::add-mask::$PLUGIN_SIGNING_KEY"
                  echo "signing-mode=Signing key: run-only CI key; these artifacts cannot be published." >> "$GITHUB_OUTPUT"
                  echo "PLUGIN_SIGNING_KEY=$PLUGIN_SIGNING_KEY" >> "$GITHUB_ENV"

            - name: 📦 Collect plugin artifacts
              id: collect-plugin-artifacts
              run: node scripts/collect-plugins.mjs --manifest "$RUNNER_TEMP/plugins.json"

            - name: 🔏 Sign collected plugins
              id: sign-collected-plugins
              uses: ./actions/sign-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  developer-name: Filiph Sandström
                  signing-key: ${{ env.PLUGIN_SIGNING_KEY }}

            - name: 🔑 Resolve signing public key
              id: signing-key
              run: |
                  node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
                  import { publicKeyOf } from "@pumpkin-plugins/signing";
                  console.log(`public-key=${publicKeyOf(process.env.PLUGIN_SIGNING_KEY)}`);
                  NODE

            - name: ✅ Verify signed plugin artifacts
              id: verify-signed-plugin-artifacts
              uses: ./actions/verify-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  expected-public-key: ${{ steps.signing-key.outputs.public-key }}

            - name: 🔎 Install verified signed plugins for integration tests
              id: install-verified-signed-plugins-for-integration-tests
              run: node scripts/install-signed-plugin-builds.mjs

            - name: 📦 Upload build artifact
              id: upload-signed-plugins
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugins
                  path: dist/

            - name: 📦 Upload plugin builds for integration tests
              id: upload-plugin-builds-for-integration-tests
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugin-wasm
                  path: packages/*/build/*.wasm

            - name: 📦 Upload update-check fixture
              id: upload-update-check-fixture
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: update-check-fixture
                  path: tools/update-check/build/update-check-fixture.wasm

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Plugin build
                  artifact-url: ${{ steps.upload-signed-plugins.outputs.artifact-url }}
                  link-label: Download signed plugins and SHA-256 checksums
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  note: ${{ steps.prepare-signing-key.outputs.signing-mode }} Artifacts expire after one day.

    external-consumer:
        name: 📦 External consumer
        needs: [changes]
        if: fromJSON(needs.changes.outputs.jobs)['external-consumer']
        uses: ./.github/workflows/external-consumer.yml
        with:
            platforms: ${{ needs.changes.outputs.external_consumer_full == 'true' && '["Linux x64", "macOS arm64", "Windows x64"]' || '["Linux x64"]' }}

    engine-comparison:
        name: 📊 Engine comparison
        needs: [changes, build]
        if: fromJSON(needs.changes.outputs.jobs)['engine-comparison']
        uses: ./.github/workflows/engine-comparison.yml

    integration:
        name: 🎃 Integration (real Pumpkin)
        needs: [changes, build]
        if: fromJSON(needs.changes.outputs.jobs).integration
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔧 Restore Static Hermes toolchain
              id: restore-static-hermes-toolchain
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Verify Static Hermes is prepared
              id: verify-static-hermes-is-prepared
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            - name: 📥 Download plugin builds
              id: download-plugin-builds
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: plugin-wasm
                  path: packages/

            - name: 📥 Download update-check fixture
              id: download-update-check-fixture
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: update-check-fixture
                  path: tools/update-check/build/

            - name: 🏗️ Build plugin CLI for isolated integration tests
              id: build-plugin-cli-for-isolated-integration-tests
              run: pnpm turbo run build --filter=@pumpkin-plugins/build

            - name: 🎃 Integration tests
              id: integration-tests
              env:
                  INTEGRATION_SCOPE: ${{ needs.changes.outputs.integration_scope }}
                  INTEGRATION_PACKAGES: ${{ needs.changes.outputs.integration_packages || '[]' }}
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs
              run: |
                  node scripts/ci-run.mjs "Selected real-server integration suites" -- bash -euo pipefail <<'CI_CHECK'
                  if [ "$INTEGRATION_SCOPE" = affected ]; then
                      if [ "$INTEGRATION_PACKAGES" = '[]' ]; then
                          echo 'Affected integration scope has no package filters.' >&2
                          exit 1
                      fi
                      filters=()
                      while IFS= read -r package; do
                          filters+=(--filter="...$package")
                      done < <(node -e 'for (const name of JSON.parse(process.env.INTEGRATION_PACKAGES)) console.log(name)')
                      pnpm turbo run test:integration --concurrency=2 --only "${filters[@]}"
                  else
                      pnpm turbo run test:integration --concurrency=2 --only
                  fi
                  CI_CHECK

            - name: 📤 Upload server logs
              id: upload-server-logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  name: pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Real-server integration tests
                  tests: 'true'

    generator:
        name: 🧬 Generator
        # Build saves the prepared Static Hermes cache that this job restores.
        needs: [changes, lint, build]
        if: fromJSON(needs.changes.outputs.jobs).generator
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔧 Setup Static Hermes toolchain
              id: setup-static-hermes-toolchain
              uses: ./.github/common/setup-static-hermes

            - name: 🏗️ Prepare Static Hermes
              id: prepare-static-hermes
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes

            # A throwaway plugin proves the templates still produce something that builds and loads.
            - name: 🧬 Generate a sample plugin
              id: generate-a-sample-plugin
              run: pnpm gen --args ci-sample CiSample "Generator smoke test"

            - name: 🧬 Generate a sample action
              id: generate-a-sample-action
              run: pnpm gen:action --args ci-sample-action "CI Sample Action" "Generator smoke test action"

            - name: 🧬 Generate a sample extension
              id: generate-a-sample-extension
              run: pnpm gen:extension --args ci-sample-extension "CI Sample Extension" "Generator smoke test extension"

            - name: 🏷️ It is registered and documented
              id: it-is-registered-and-documented
              run: |
                  pnpm run check
                  pnpm run readme:check

            - name: 🧪 Test the generated action
              id: test-the-generated-action
              run: node scripts/ci-run.mjs "Generated action tests" -- node --test actions/ci-sample-action/src/*.test.mjs

            - name: 🧪 Test and package the generated extension
              id: test-and-package-the-generated-extension
              run: |
                  node scripts/ci-run.mjs "Generated extension validation" -- bash -euo pipefail <<'CI_CHECK'
                  pnpm --filter ./extensions/ci-sample-extension run typecheck
                  pnpm --filter ./extensions/ci-sample-extension run test
                  pnpm --filter ./extensions/ci-sample-extension run build
                  pnpm --filter ./extensions/ci-sample-extension run package -- --out "$RUNNER_TEMP/ci-sample-extension.vsix"
                  CI_CHECK

            - name: 🎃 Typecheck, build and load it on a real Pumpkin
              id: typecheck-build-and-load-it-on-a-real-pumpkin
              run: |
                  node scripts/ci-run.mjs "Generated plugin typecheck, build and integration" -- bash -euo pipefail <<'CI_CHECK'
                  pnpm build --filter=@pumpkin-plugins/ci-sample
                  pnpm turbo run typecheck test:integration --filter=@pumpkin-plugins/ci-sample
                  CI_CHECK
              env:
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs

            - name: 📤 Upload server logs
              id: upload-server-logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  name: generator-pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

            - name: 📋 Job summary
              id: job-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Generator smoke tests
                  tests: 'true'

    # The single required status check: it fails when a job the change needs did not pass, or when
    # any job failed. scripts/ci-gate.mjs holds the selection table that every job's `if:` reads.
    ci-result:
        name: 🛡️ CI result
        needs: [changes, commits, lint, typecheck, test, extension-tests, docs, build, external-consumer, integration, generator]
        if: ${{ always() && !startsWith(github.head_ref, 'release-please--branches--') }}
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: |
                      .node-version
                      scripts/ci-gate.mjs
                  sparse-checkout-cone-mode: false

            - name: 🟢 Setup Node
              id: setup-node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version

            - name: 🛡️ Require every selected job to pass
              id: check-results
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: node scripts/ci-gate.mjs check

    release:
        name: 🚢 Release
        needs: [ci-result]
        if: >-
            ${{
              always() &&
              (
                (
                  github.event_name == 'workflow_dispatch' &&
                  github.ref == 'refs/heads/master' &&
                  inputs.release_commit != ''
                ) ||
                (github.event_name == 'push' && needs['ci-result'].result == 'success')
              )
            }}
        permissions:
            contents: write
            id-token: write
        uses: ./.github/workflows/release.yml
        with:
            release_commit: ${{ inputs.release_commit || '' }}
            tool_only: ${{ github.event_name == 'workflow_dispatch' }}
        secrets: inherit
