name: CI

on:
    pull_request:
    push:
        branches:
            - master
            - main

concurrency:
    group: ci-${{ github.ref }}
    # Let push runs finish: release-please must not be interrupted between creating a tag
    # and updating its release PR. Pull request runs can still be superseded safely.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    changes:
        name: 🔍 Changed files
        timeout-minutes: 5
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.classify.outputs.code }}
            integration_scope: ${{ steps.classify.outputs.integration_scope }}
            integration_extra: ${{ steps.classify.outputs.integration_extra }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  # Diffing against the base needs the history behind it, not just the one commit.
                  fetch-depth: 0

            # Everything else keys off this: a change that touches only documentation can't break a
            # build, a test or a plugin, so it skips the jobs that would tell us otherwise.
            - name: 🔍 What the change touches
              id: classify
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/changed-areas.mjs "$BASE" "$HEAD"

    commits:
        name: 💬 Commit messages
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 💬 Lint commits
              uses: wagoid/commitlint-github-action@v6.2.1
              with:
                  configFile: commitlint.config.mjs

    lint:
        name: 📋 Lint
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📋 Lint
              run: pnpm run lint

    typecheck:
        name: ✅ Typecheck
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: ✅ Typecheck
              run: pnpm run typecheck

    test:
        name: 🧪 Test
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🧪 Unit tests
              run: pnpm run test

            - name: 🧪 Script tests
              run: pnpm run test:scripts

    docs:
        name: 📝 Docs and config
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Generated READMEs are current
              run: pnpm run readme:check

            # Release config, package metadata, and hand-written docs against the code.
            - name: 🏷️ Repo checks
              run: pnpm run check

    build:
        name: 🔨 Build
        needs: [changes, lint, typecheck]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 25
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔨 Build All
              run: pnpm run build

            - name: 📦 Collect plugins
              run: pnpm run package
              env:
                  PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}

            - name: 📦 Upload build artifact
              uses: actions/upload-artifact@v7.0.1
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugins
                  path: dist/

            - name: 📦 Upload plugin builds for integration tests
              uses: actions/upload-artifact@v7.0.1
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugin-wasm
                  path: packages/*/build/*.wasm

            - name: 📦 Upload update-check fixture
              uses: actions/upload-artifact@v7.0.1
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: update-check-fixture
                  path: tools/update-check/build/update-check-fixture.wasm

    integration:
        name: 🎃 Integration (real Pumpkin)
        needs: [changes, build]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📥 Download plugin builds
              uses: actions/download-artifact@v8.0.1
              with:
                  name: plugin-wasm
                  path: packages/

            - name: 📥 Download update-check fixture
              uses: actions/download-artifact@v8.0.1
              with:
                  name: update-check-fixture
                  path: tools/update-check/build/

            - name: 🎃 Integration tests
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  INTEGRATION_SCOPE: ${{ needs.changes.outputs.integration_scope }}
                  INTEGRATION_EXTRA: ${{ needs.changes.outputs.integration_extra }}
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs
              run: |
                  if [ "$INTEGRATION_SCOPE" = affected ]; then
                      filters=(--filter="...[$BASE_SHA]")
                      if [ -n "$INTEGRATION_EXTRA" ]; then
                          filters+=(--filter="$INTEGRATION_EXTRA")
                      fi
                      pnpm exec turbo run test:integration --concurrency=4 --only "${filters[@]}"
                  else
                      pnpm exec turbo run test:integration --concurrency=4 --only
                  fi

            - name: 📤 Upload server logs
              if: failure()
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

    generator:
        name: 🧬 Generator
        needs: [changes, lint]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            # A throwaway plugin proves the templates still produce something that builds and loads.
            - name: 🧬 Generate a sample plugin
              run: pnpm gen --args ci-sample CiSample "Generator smoke test"

            - name: 🏷️ It is registered and documented
              run: |
                  pnpm run check
                  pnpm run readme:check

            - name: 🎃 Typecheck, build and load it on a real Pumpkin
              run: pnpm exec turbo run typecheck build test:integration --filter=@pumpkin-plugins/ci-sample
              env:
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs

            - name: 📤 Upload server logs
              if: failure()
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: generator-pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

    release:
        name: 🚢 Release
        needs: [changes, build, test, docs, integration]
        if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
        timeout-minutes: 10
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            paths_released: ${{ steps.release.outputs.paths_released }}
            all: ${{ toJSON(steps.release.outputs) }}
            prs: ${{ steps.release.outputs.prs }}
        steps:
            - name: 🚢 Release Please
              id: release
              uses: googleapis/release-please-action@v5.0.0
              with:
                  # GITHUB_TOKEN-created PRs don't trigger CI. Set RELEASE_PLEASE_TOKEN to a PAT
                  # or app token if CI should run on the release PR.
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    release-pr:
        name: 📝 Prepare release PR ${{ matrix.pr.headBranchName }}
        needs: [release]
        if: ${{ needs.release.outputs.prs != '' && needs.release.outputs.prs != '[]' }}
        timeout-minutes: 10
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                pr: ${{ fromJSON(needs.release.outputs.prs) }}
        steps:
            # Release Please rewrites each PR branch on updates. Prepare every returned PR.
            - name: 🕶️ Checkout release PR branch
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ matrix.pr.headBranchName }}
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Regenerate READMEs
              run: pnpm run readme

            # The pin that forces a first release to 0.0.1 also pins every release after it, and
            # master fails the release config check while it is there, which takes the release and
            # attach jobs with it. Drop it on the PR, so the merge push can tag and attach.
            - name: 🎉 Retire release-as for released plugins
              run: |
                  node scripts/unpin-release-as.mjs
                  if [ -z "$(git status --porcelain -- release-please-config.json)" ]; then
                      echo "Nothing to retire"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -- release-please-config.json
                  git commit -m "chore: let release-please bump the released plugins"
                  git push

            - name: 💾 Commit READMEs to the release PR
              run: |
                  if [ -z "$(git status --porcelain)" ]; then
                      echo "READMEs are already up to date"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -- README.md 'packages/*/README.md'
                  git commit -m "docs: update generated READMEs"
                  git push

    assets:
        name: 📎 Attach ${{ matrix.path }}
        needs: [release]
        if: ${{ needs.release.outputs.paths_released != '[]' }}
        timeout-minutes: 10
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                path: ${{ fromJSON(needs.release.outputs.paths_released) }}
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ fromJSON(needs.release.outputs.all)[format('{0}--tag_name', matrix.path)] }}
        steps:
            - name: 📥 Download build artifact
              uses: actions/download-artifact@v8.0.1
              with:
                  name: plugins
                  path: dist/

            # A master push from before the release PR merged can still be running when its
            # release job creates the tag, and it would attach the build of that older commit. The
            # tag says which commit it releases, so only the run for that commit may attach.
            - name: 🔒 Check the tag is the commit this run built
              run: |
                  ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
                  sha="${ref##* }"
                  if [ "${ref%% *}" = tag ]; then
                      sha="$(gh api "repos/$GH_REPO/git/tags/$TAG" --jq '.object.sha')"
                  fi
                  if [ "$sha" != "$GITHUB_SHA" ]; then
                      echo "::error::$TAG releases $sha, but this run built $GITHUB_SHA. Not attaching anything."
                      exit 1
                  fi

            - name: 📎 Upload to the release
              run: |
                  name="$(basename "${{ matrix.path }}")"
                  gh release upload "$TAG" "dist/$name.wasm" "dist/$name.wasm.sha256" --clobber

    market:
        name: 🛒 Market ${{ matrix.path }}
        needs: [release, assets]
        if: ${{ needs.release.outputs.paths_released != '[]' }}
        timeout-minutes: 10
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                path: ${{ fromJSON(needs.release.outputs.paths_released) }}
        env:
            MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
            TAG: ${{ fromJSON(needs.release.outputs.all)[format('{0}--tag_name', matrix.path)] }}
            MARKET_RELEASE_NOTES: ${{ fromJSON(needs.release.outputs.all)[format('{0}--body', matrix.path)] }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            # The publisher imports src/info.ts to use the canonical Pumpkin plugin name.
            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📥 Download build artifact
              uses: actions/download-artifact@v8.0.1
              with:
                  name: plugins
                  path: dist/

            # A plugin needs a listing before its releases can be uploaded. The script warns and
            # succeeds when there is no matching listing, so GitHub releases remain unaffected.
            - name: 🛒 Publish to market.pumpkinmc.org
              run: node scripts/publish-to-market.mjs "${{ matrix.path }}" "$TAG" "dist/$(basename "${{ matrix.path }}").wasm"
