name: CI

on:
    pull_request:
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/*/docs/**'
            - '!actions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'
    push:
        branches:
            - master
            - main
        paths:
            - '**'
            - '!**/*.md'
            - '!**/*.mdx'
            - '!docs/**'
            - '!packages/*/docs/**'
            - '!tools/*/docs/**'
            - '!actions/*/docs/**'
            - '!.github/workflows/docs.yml'
            - '!LICENSE'
            # The generated README commit needs CI's generated_readmes check to run.
            - 'README.md'
            - 'packages/*/README.md'
            - 'actions/*/README.md'

concurrency:
    group: ci-${{ github.ref }}
    # Let push runs finish: release-please must not be interrupted between creating a tag
    # and updating its release PR. Pull request runs can still be superseded safely.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    DO_NOT_TRACK: 1

permissions:
    contents: read

jobs:
    changes:
        name: 🔍 Changed files
        timeout-minutes: 5
        runs-on: ubuntu-24.04
        outputs:
            code: ${{ steps.classify.outputs.code }}
            actions: ${{ steps.classify.outputs.actions }}
            generated_readmes: ${{ steps.classify.outputs.generated_readmes }}
            integration_scope: ${{ steps.classify.outputs.integration_scope }}
            integration_extra: ${{ steps.classify.outputs.integration_extra }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  # Diffing against the base needs the history behind it, not just the one commit.
                  fetch-depth: 0

            - name: 📥 Fetch comparison base
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: git fetch --no-tags origin "$BASE"

            # Everything else keys off this: a change that touches only documentation can't break a
            # build, a test or a plugin, so it skips the jobs that would tell us otherwise.
            - name: 🔍 What the change touches
              id: classify
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node scripts/changed-areas.mjs "$BASE" "$HEAD"

    commits:
        name: 💬 Commit messages
        needs: [changes]
        if: >-
            ${{
              github.event_name == 'pull_request' &&
              (
                needs.changes.outputs.code == 'true' ||
                needs.changes.outputs.actions != '[]' ||
                needs.changes.outputs.generated_readmes == 'true'
              )
            }}
        timeout-minutes: 5
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 💬 Lint commits
              uses: wagoid/commitlint-github-action@v6.2.1
              with:
                  configFile: commitlint.config.mjs

    lint:
        name: 📋 Lint
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📋 Lint
              run: pnpm run lint

    typecheck:
        name: ✅ Typecheck
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: ✅ Typecheck
              run: pnpm run typecheck

    test:
        name: 🧪 Test
        needs: [changes]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🧪 Unit tests with coverage
              run: pnpm run coverage

            - name: ☂️ Upload coverage
              uses: codecov/codecov-action@v7.1.1
              with:
                  directory: .
                  flags: unittests
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: 🧪 Script tests
              run: pnpm run test:scripts

    docs:
        name: 📝 Docs and config
        needs: [changes]
        if: >-
            ${{
              needs.changes.outputs.code == 'true' ||
              needs.changes.outputs.actions != '[]' ||
              needs.changes.outputs.generated_readmes == 'true'
            }}
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Generated READMEs are current
              run: pnpm run readme:check

            # Release config, package metadata, and hand-written docs against the code.
            - name: 🏷️ Repo checks
              run: pnpm run check

    build:
        name: 🔨 Build
        needs: [changes, lint, typecheck]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 25
        runs-on: ubuntu-24.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔨 Build All
              run: pnpm run build

            # Fork PRs cannot access repository secrets. Sign their CI artifacts with a run-only
            # key so the build and integration artifacts are always signed without exposing the
            # repository release key.
            - name: 🔏 Prepare signing key
              env:
                  PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
              run: |
                  PLUGIN_SIGNING_KEY="$(printf '%s' "$PLUGIN_SIGNING_KEY" | tr -d '[:space:]')"
                  if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$PLUGIN_SIGNING_KEY" ]; then
                      PLUGIN_SIGNING_KEY="$(node --input-type=module -e 'import { generateKeyPair } from "@pumpkin-plugins/signing"; process.stdout.write(generateKeyPair().secretKeyHex);')"
                      echo "::add-mask::$PLUGIN_SIGNING_KEY"
                      echo "::warning title=Ephemeral signing key::This run uses a run-only key; its signed artifacts are for CI and cannot be published."
                  fi
                  echo "PLUGIN_SIGNING_KEY=$PLUGIN_SIGNING_KEY" >> "$GITHUB_ENV"

            - name: 📦 Collect plugin artifacts
              run: node scripts/collect-plugins.mjs --manifest "$RUNNER_TEMP/plugins.json"

            - name: 🔏 Sign collected plugins
              uses: ./actions/sign-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  developer-name: Filiph Sandström
                  signing-key: ${{ env.PLUGIN_SIGNING_KEY }}

            - name: 🔑 Resolve signing public key
              id: signing-key
              run: |
                  node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
                  import { publicKeyOf } from "@pumpkin-plugins/signing";
                  console.log(`public-key=${publicKeyOf(process.env.PLUGIN_SIGNING_KEY)}`);
                  NODE

            - name: ✅ Verify signed plugin artifacts
              uses: ./actions/verify-pumpkin-plugin
              with:
                  plugins-manifest: ${{ runner.temp }}/plugins.json
                  expected-public-key: ${{ steps.signing-key.outputs.public-key }}

            - name: 🔎 Install verified signed plugins for integration tests
              run: node scripts/install-signed-plugin-builds.mjs

            - name: 📦 Upload build artifact
              id: upload-signed-plugins
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugins
                  path: dist/

            - name: 📝 Add signed plugins to the job summary
              env:
                  ARTIFACT_URL: ${{ steps.upload-signed-plugins.outputs.artifact-url }}
              run: |
                  {
                      echo "### Signed plugin artifacts"
                      echo
                      echo "[Download signed plugin files]($ARTIFACT_URL)"
                      echo
                      echo "Available for one day."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: 📦 Upload plugin builds for integration tests
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: plugin-wasm
                  path: packages/*/build/*.wasm

            - name: 📦 Upload update-check fixture
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: update-check-fixture
                  path: tools/update-check/build/update-check-fixture.wasm

    integration:
        name: 🎃 Integration (real Pumpkin)
        needs: [changes, build]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 60
        runs-on: ubuntu-24.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📥 Download plugin builds
              uses: actions/download-artifact@v8.0.2
              with:
                  name: plugin-wasm
                  path: packages/

            - name: 📥 Download update-check fixture
              uses: actions/download-artifact@v8.0.2
              with:
                  name: update-check-fixture
                  path: tools/update-check/build/

            - name: 🎃 Integration tests
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  INTEGRATION_SCOPE: ${{ needs.changes.outputs.integration_scope }}
                  INTEGRATION_EXTRA: ${{ needs.changes.outputs.integration_extra }}
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs
              run: |
                  if [ "$INTEGRATION_SCOPE" = affected ]; then
                      filters=(--filter="...[$BASE_SHA]")
                      if [ -n "$INTEGRATION_EXTRA" ]; then
                          filters+=(--filter="$INTEGRATION_EXTRA")
                      fi
                      pnpm exec turbo run test:integration --concurrency=4 --only "${filters[@]}"
                  else
                      pnpm exec turbo run test:integration --concurrency=4 --only
                  fi

            - name: 📤 Upload server logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

    generator:
        name: 🧬 Generator
        needs: [changes, lint]
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 60
        runs-on: ubuntu-24.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            # A throwaway plugin proves the templates still produce something that builds and loads.
            - name: 🧬 Generate a sample plugin
              run: pnpm gen --args ci-sample CiSample "Generator smoke test"

            - name: 🧬 Generate a sample action
              run: pnpm gen:action --args ci-sample-action "CI Sample Action" "Generator smoke test action"

            - name: 🏷️ It is registered and documented
              run: |
                  pnpm run check
                  pnpm run readme:check

            - name: 🧪 Test the generated action
              run: node --test actions/ci-sample-action/src/*.test.mjs

            - name: 🎃 Typecheck, build and load it on a real Pumpkin
              run: pnpm exec turbo run typecheck build test:integration --filter=@pumpkin-plugins/ci-sample
              env:
                  PUMPKIN_TEST_LOG_DIR: ${{ runner.temp }}/pumpkin-logs

            - name: 📤 Upload server logs
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  name: generator-pumpkin-logs
                  path: ${{ runner.temp }}/pumpkin-logs
                  if-no-files-found: ignore

    release:
        name: 🚢 Release
        needs: [changes, build, test, docs, integration]
        if: >-
            ${{
              always() &&
              github.event_name == 'push' &&
              needs.changes.result == 'success' &&
              needs.docs.result == 'success' &&
              (
                (
                  needs.changes.outputs.code == 'true' &&
                  needs.build.result == 'success' &&
                  needs.test.result == 'success' &&
                  needs.integration.result == 'success'
                ) ||
                (
                  needs.changes.outputs.code != 'true' &&
                  needs.changes.outputs.actions != '[]'
                )
              )
            }}
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        outputs:
            paths_released: ${{ steps.release.outputs.paths_released }}
            action_paths_released: ${{ steps.release.outputs.action_paths_released }}
            all: ${{ toJSON(steps.release.outputs) }}
            prs: ${{ steps.release-prs.outputs.prs }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔑 Create release token
              id: app-token
              uses: actions/create-github-app-token@v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - name: 🚢 Release Please with bundled dependency changes
              id: release
              env:
                  # App-token-created PRs trigger CI; GITHUB_TOKEN-created PRs do not.
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: pnpm --package=release-please@17.11.2 dlx -c 'node scripts/release.mjs "$(command -v release-please)"'

            - name: 📋 Find open release PRs to prepare
              id: release-prs
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  prefix="release-please--branches--${DEFAULT_BRANCH}--components--"
                  prs="$(gh pr list --state open --base "$DEFAULT_BRANCH" --limit 1000 --json headRefName \
                      | jq --compact-output --arg prefix "$prefix" '[.[] | select(.headRefName | startswith($prefix))]')"
                  echo "prs=$prs" >> "$GITHUB_OUTPUT"

    release-pr:
        name: 📝 Prepare release PR ${{ matrix.pr.headRefName }}
        needs: [release]
        if: ${{ needs.release.outputs.prs != '' && needs.release.outputs.prs != '[]' }}
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                pr: ${{ fromJSON(needs.release.outputs.prs) }}
        steps:
            - name: 🔑 Create release PR token
              id: app-token
              uses: actions/create-github-app-token@v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            # Release Please rewrites each PR branch on updates. Prepare every returned PR.
            - name: 🕶️ Checkout release PR branch
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ matrix.pr.headRefName }}
                  token: ${{ steps.app-token.outputs.token }}

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📝 Regenerate READMEs
              run: pnpm run readme

            # The first-release pin forces version 0.0.1, then must be removed before merge so the
            # release config check passes and Release Please can handle subsequent versions.
            - name: 🎉 Retire first-release pins
              run: |
                  node scripts/unpin-release-as.mjs
                  if [ -z "$(git status --porcelain -- release-please-config.json)" ]; then
                      echo "Nothing to retire"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -- release-please-config.json
                  git commit -m "chore: retire first-release pins"
                  git push

            - name: 🏷️ Update action README version examples
              run: node scripts/update-action-readmes.mjs

            - name: 💾 Commit READMEs to the release PR
              run: |
                  if [ -z "$(git status --porcelain)" ]; then
                      echo "READMEs are already up to date"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -- README.md 'packages/*/README.md' 'actions/*/README.md'
                  git commit -m "docs: update generated READMEs"
                  git push

    assets:
        name: 📎 Attach ${{ matrix.path }}
        needs: [release]
        if: ${{ needs.release.outputs.paths_released != '[]' }}
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                path: ${{ fromJSON(needs.release.outputs.paths_released) }}
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ fromJSON(needs.release.outputs.all)[format('{0}--tag_name', matrix.path)] }}
            PLUGIN_DIRECTORY: ${{ matrix.path }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            # Resolve the same canonical plugin name the Market job uses.
            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📥 Download build artifact
              uses: actions/download-artifact@v8.0.2
              with:
                  name: plugins
                  path: dist/

            # A master push from before the release PR merged can still be running when its
            # release job creates the tag, and it would attach the build of that older commit. The
            # tag says which commit it releases, so only the run for that commit may attach.
            - name: 🔒 Check the tag is the commit this run built
              run: |
                  ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
                  sha="${ref##* }"
                  if [ "${ref%% *}" = tag ]; then
                      sha="$(gh api "repos/$GH_REPO/git/tags/$TAG" --jq '.object.sha')"
                  fi
                  if [ "$sha" != "$GITHUB_SHA" ]; then
                      echo "::error::$TAG releases $sha, but this run built $GITHUB_SHA. Not attaching anything."
                      exit 1
                  fi

            - name: 🧾 Resolve signing inputs
              id: plugin
              env:
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  echo "plugin_name=$(node scripts/market-plugin-name.mjs "$PLUGIN_DIRECTORY")" >> "$GITHUB_OUTPUT"
                  echo "version=${RELEASE_TAG##*-v}" >> "$GITHUB_OUTPUT"
                  echo "wasm_file=dist/$(basename "$PLUGIN_DIRECTORY").wasm" >> "$GITHUB_OUTPUT"

            - name: 🔏 Sign release artifact
              uses: ./actions/sign-pumpkin-plugin
              with:
                  plugin-name: ${{ steps.plugin.outputs.plugin_name }}
                  version: ${{ steps.plugin.outputs.version }}
                  wasm-file: ${{ steps.plugin.outputs.wasm_file }}
                  developer-name: Filiph Sandström
                  signing-key: ${{ secrets.PLUGIN_SIGNING_KEY }}

            - name: 📦 Prepare signed release artifact
              env:
                  WASM_FILE: ${{ steps.plugin.outputs.wasm_file }}
              run: |
                  mkdir -p signed
                  cp "$WASM_FILE" signed/
                  cp "$WASM_FILE.sha256" signed/

            - name: 📤 Upload signed release artifact
              uses: actions/upload-artifact@v7.0.2
              with:
                  retention-days: 1
                  overwrite: true
                  compression-level: 0
                  if-no-files-found: error
                  name: release-${{ env.TAG }}
                  path: signed/

            - name: 📎 Upload to the release
              run: |
                  name="$(basename "$PLUGIN_DIRECTORY")"
                  gh release upload "$TAG" "signed/$name.wasm" "signed/$name.wasm.sha256" --clobber

    market:
        name: 🛒 Market ${{ matrix.path }}
        needs: [release, assets]
        if: ${{ needs.release.outputs.paths_released != '[]' }}
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                path: ${{ fromJSON(needs.release.outputs.paths_released) }}
        env:
            TAG: ${{ fromJSON(needs.release.outputs.all)[format('{0}--tag_name', matrix.path)] }}
            MARKET_RELEASE_NOTES: ${{ fromJSON(needs.release.outputs.all)[format('{0}--body', matrix.path)] }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@v7.0.1

            # The publisher resolves the canonical plugin name from the package's info module.
            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 📥 Download build artifact
              uses: actions/download-artifact@v8.0.2
              with:
                  name: release-${{ env.TAG }}
                  path: dist/

            - name: 🧾 Resolve Market action inputs
              id: market
              env:
                  PLUGIN_DIRECTORY: ${{ matrix.path }}
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  echo "plugin_name=$(node scripts/market-plugin-name.mjs "$PLUGIN_DIRECTORY")" >> "$GITHUB_OUTPUT"
                  echo "version=${RELEASE_TAG##*-v}" >> "$GITHUB_OUTPUT"
                  echo "wasm_file=dist/$(basename "$PLUGIN_DIRECTORY").wasm" >> "$GITHUB_OUTPUT"

            # Missing credentials or a not-yet-published listing produce a warning and leave the
            # GitHub release intact. API failures still fail this job so it can be retried.
            - name: 🛒 Publish to Pumpkin Market
              id: publish
              uses: ./actions/publish-to-pumpkin-market
              with:
                  plugin-name: ${{ steps.market.outputs.plugin_name }}
                  version: ${{ steps.market.outputs.version }}
                  wasm-file: ${{ steps.market.outputs.wasm_file }}
                  api-token: ${{ secrets.MARKET_API_TOKEN }}
                  release-notes: ${{ env.MARKET_RELEASE_NOTES }}
                  warn: true

            - name: 🧾 Generate Market description and commands
              if: steps.publish.outputs.status == 'success'
              env:
                  PLUGIN_DIRECTORY: ${{ matrix.path }}
                  METADATA_FILE: ${{ runner.temp }}/market-listing-metadata.json
              run: node scripts/market-plugin-metadata.mjs "$PLUGIN_DIRECTORY" > "$METADATA_FILE"

            - name: 📝 Update Pumpkin Market listing metadata
              if: steps.publish.outputs.status == 'success'
              uses: ./actions/update-pumpkin-market-listing
              with:
                  plugin-id: ${{ steps.publish.outputs.listing-id }}
                  metadata-file: ${{ runner.temp }}/market-listing-metadata.json
                  api-token: ${{ secrets.MARKET_API_TOKEN }}
                  update-mode: patch

    cleanup:
        name: 🧹 Cleanup artifacts
        needs: [build, integration, release, assets, market]
        if: >-
            ${{
              always() &&
              needs.build.result == 'success' &&
              (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
              (needs.release.result == 'success' || needs.release.result == 'skipped') &&
              (needs.assets.result == 'success' || needs.assets.result == 'skipped') &&
              (needs.market.result == 'success' || needs.market.result == 'skipped') &&
              (
                github.event_name != 'pull_request' ||
                (
                  github.actor != 'dependabot[bot]' &&
                  github.event.pull_request.head.repo.full_name == github.repository
                )
              )
            }}
        timeout-minutes: 5
        runs-on: ubuntu-24.04
        permissions:
            actions: write
        steps:
            - name: 🧹 Delete artifacts after their last consumer
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  artifact_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                      --jq '.artifacts[] | select(.name == "plugin-wasm" or .name == "update-check-fixture" or (.name | startswith("release-"))) | .id')"
                  if [ -z "$artifact_ids" ]; then
                      echo "No temporary artifacts to delete"
                      exit 0
                  fi
                  while IFS= read -r artifact_id; do
                      [ -z "$artifact_id" ] && continue
                      gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
                      echo "Deleted temporary artifact $artifact_id"
                  done <<< "$artifact_ids"
