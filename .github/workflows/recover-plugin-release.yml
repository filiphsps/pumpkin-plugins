name: Recover plugin release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing plugin release tag to finish
                required: true
                type: string

concurrency:
    group: release-recovery-${{ inputs.tag }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    default-branch:
        name: 🔒 Require the default branch
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🔒 Require the default branch
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
                      echo "::error::Run this workflow from $DEFAULT_BRANCH; received $GITHUB_REF."
                      exit 1
                  fi

    recover:
        name: Recover ${{ inputs.tag }}
        needs: [default-branch]
        permissions:
            contents: write
        uses: ./.github/workflows/publish-plugin-release.yml
        with:
            tag: ${{ inputs.tag }}
        secrets: inherit
