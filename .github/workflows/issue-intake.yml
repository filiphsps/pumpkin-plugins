name: Issue intake

on:
    issues:
        types:
            - opened
            - edited

permissions:
    contents: read
    issues: write

concurrency:
    group: issue-intake-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    validate:
        name: 🧾 Check issue intake
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: ⚙️ Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: 🔧 Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: 📦 Install form parser dependency
              run: pnpm install --filter pumpkin-plugins --frozen-lockfile --ignore-scripts

            - name: 📝 Validate issue details
              run: node .github/scripts/issue-intake.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
