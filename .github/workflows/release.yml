name: Releases

on:
    workflow_call:
        inputs:
            release_commit:
                description: Existing release commit to recover for npm publication
                required: false
                type: string
                default: ''
            tool_only:
                description: Publish only npm tools from an explicitly selected release commit
                required: false
                type: boolean
                default: false

permissions:
    contents: read

env:
    CI: true
    DO_NOT_TRACK: 1

jobs:
    release:
        name: 🚢 Release
        if: ${{ !github.event.repository.fork }}
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        env:
            RELEASE_TARGET_SHA: ${{ inputs.release_commit || github.sha }}
            RELEASE_TOOL_ONLY: ${{ inputs.tool_only }}
        permissions:
            contents: read
        outputs:
            paths_released: ${{ steps.release.outputs.paths_released }}
            action_paths_released: ${{ steps.release.outputs.action_paths_released }}
            tool_paths_released: ${{ steps.release.outputs.tool_paths_released }}
            extension_paths_released: ${{ steps.release.outputs.extension_paths_released }}
            release_count: ${{ steps.release.outputs.release_count }}
            prepared_pr_count: ${{ steps.release.outputs.pr_count }}
            open_pr_count: ${{ steps.release-prs.outputs.open_pr_count }}
            release_metadata: ${{ steps.release.outputs.release_metadata }}
            prs: ${{ steps.release-prs.outputs.prs }}
        steps:
            - name: 🕶️ Checkout repository
              id: checkout-repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: 🚀 Bootstrap
              id: bootstrap
              uses: ./.github/common/bootstrap

            - name: 💾 Restore Release Please commit file cache
              id: restore-release-please-commit-file-cache
              continue-on-error: true
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .cache/release-commit-files.json
                  key: release-commit-files-v1-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      release-commit-files-v1-

            - name: 🔑 Create release token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - name: 🚢 Release Please with bundled dependency changes
              id: release
              env:
                  # App-token-created PRs trigger CI; GITHUB_TOKEN-created PRs do not.
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  RELEASE_COMMIT_FILES_CACHE: .cache/release-commit-files.json
              run: pnpm --package=release-please@17.11.2 dlx -c 'node scripts/release.mjs "$(command -v release-please)"'

            - name: 💾 Save Release Please commit file cache
              id: save-release-please-commit-file-cache
              if: >-
                  steps.release.outcome == 'success' &&
                  github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              continue-on-error: true
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .cache/release-commit-files.json
                  key: release-commit-files-v1-${{ github.run_id }}-${{ github.run_attempt }}

            - name: 📋 Find open release PRs to prepare
              id: release-prs
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  EXPECTED_PR_COUNT: ${{ steps.release.outputs.pr_count }}
                  TOOL_ONLY: ${{ inputs.tool_only }}
              run: |
                  set -euo pipefail
                  prefix="release-please--branches--${DEFAULT_BRANCH}--components--"
                  expected="$EXPECTED_PR_COUNT"
                  if [[ ! "$expected" =~ ^[0-9]+$ ]]; then
                      echo "::error::Release Please returned an invalid release PR count: $expected"
                      exit 1
                  fi
                  if [[ "$TOOL_ONLY" == 'true' ]]; then
                      echo 'open_pr_count=0' >> "$GITHUB_OUTPUT"
                      echo 'prs=[]' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  prs='[]'
                  open_pr_count=0
                  for attempt in 1 2 3 4 5; do
                      prs="$(gh pr list --state open --base "$DEFAULT_BRANCH" --limit 1000 --json headRefName \
                          | jq --compact-output --arg prefix "$prefix" '[.[] | select(.headRefName | startswith($prefix))]')"
                      open_pr_count="$(jq 'length' <<< "$prs")"
                      echo "Release PR discovery attempt $attempt: found $open_pr_count open release PR(s); Release Please prepared $expected."
                      if (( open_pr_count >= expected )); then
                          break
                      fi
                      sleep 3
                  done
                  if (( open_pr_count < expected )); then
                      echo "::error::Found $open_pr_count open release PR(s), but Release Please prepared $expected."
                      exit 1
                  fi
                  echo "Open release PR branches: $(jq --raw-output 'map(.headRefName) | join(", ")' <<< "$prs")"
                  echo "open_pr_count=$open_pr_count" >> "$GITHUB_OUTPUT"
                  echo "prs=$prs" >> "$GITHUB_OUTPUT"

            - name: 📋 Release summary
              id: release-summary
              if: always()
              uses: ./.github/common/job-summary
              with:
                  title: Release orchestration
                  artifact-url: ${{ github.server_url }}/${{ github.repository }}/releases
                  link-label: Browse published releases and downloads
                  facts: |
                      {
                        "Release records created": ${{ toJSON(steps.release.outputs.release_count) }},
                        "Prepared release PRs": ${{ toJSON(steps.release.outputs.pr_count) }},
                        "Open release PRs": ${{ toJSON(steps.release-prs.outputs.open_pr_count) }},
                        "Plugin releases": ${{ toJSON(steps.release.outputs.paths_released) }},
                        "Action releases": ${{ toJSON(steps.release.outputs.action_paths_released) }},
                        "npm releases": ${{ toJSON(steps.release.outputs.tool_paths_released) }},
                        "Extension releases": ${{ toJSON(steps.release.outputs.extension_paths_released) }}
                      }

    release-fanout-check:
        name: 🧮 Validate release fan-out
        needs: [release]
        if: needs.release.result == 'success'
        timeout-minutes: 5
        runs-on: ubuntu-26.04
        env:
            RELEASE_COUNT: ${{ needs.release.outputs.release_count }}
            PREPARED_PR_COUNT: ${{ needs.release.outputs.prepared_pr_count }}
            OPEN_PR_COUNT: ${{ needs.release.outputs.open_pr_count }}
            PLUGIN_PATHS: ${{ needs.release.outputs.paths_released }}
            ACTION_PATHS: ${{ needs.release.outputs.action_paths_released }}
            TOOL_PATHS: ${{ needs.release.outputs.tool_paths_released }}
            EXTENSION_PATHS: ${{ needs.release.outputs.extension_paths_released }}
            RELEASE_METADATA: ${{ needs.release.outputs.release_metadata }}
        steps:
            - name: 🧮 Require complete release outputs
              run: |
                  set -euo pipefail
                  for count in RELEASE_COUNT PREPARED_PR_COUNT OPEN_PR_COUNT; do
                      value="${!count}"
                      if [[ ! "$value" =~ ^[0-9]+$ ]]; then
                          echo "::error::$count is missing or invalid: $value"
                          exit 1
                      fi
                  done
                  plugin_count="$(jq -er 'if type == "array" then length else error("expected a JSON array") end' <<< "$PLUGIN_PATHS")"
                  action_count="$(jq -er 'if type == "array" then length else error("expected a JSON array") end' <<< "$ACTION_PATHS")"
                  tool_count="$(jq -er 'if type == "array" then length else error("expected a JSON array") end' <<< "$TOOL_PATHS")"
                  extension_count="$(jq -er 'if type == "array" then length else error("expected a JSON array") end' <<< "$EXTENSION_PATHS")"
                  if (( plugin_count + action_count + tool_count + extension_count != RELEASE_COUNT )); then
                      echo "::error::Release output mismatch: count=$RELEASE_COUNT, plugin paths=$plugin_count, action paths=$action_count, tool paths=$tool_count, extension paths=$extension_count."
                      exit 1
                  fi
                  if (( OPEN_PR_COUNT < PREPARED_PR_COUNT )); then
                      echo "::error::Release PR output mismatch: Release Please prepared $PREPARED_PR_COUNT, but only $OPEN_PR_COUNT open release PR(s) were found."
                      exit 1
                  fi
                  jq -e 'type == "object"' <<< "$RELEASE_METADATA" >/dev/null
                  while IFS= read -r release_path; do
                      [ -z "$release_path" ] && continue
                      jq -e --arg key "${release_path}--tag_name" 'has($key) and (.[$key] | type == "string" and length > 0)' \
                          <<< "$RELEASE_METADATA" >/dev/null || {
                          echo "::error::Missing tag metadata for $release_path."
                          exit 1
                      }
                      jq -e --arg key "${release_path}--sha" 'has($key) and (.[$key] | type == "string" and test("^[0-9a-f]{40}$"))' \
                          <<< "$RELEASE_METADATA" >/dev/null || {
                          echo "::error::Missing or invalid target SHA metadata for $release_path."
                          exit 1
                      }
                  done < <(jq --raw-output '.[]' <<< "$PLUGIN_PATHS"; jq --raw-output '.[]' <<< "$ACTION_PATHS"; jq --raw-output '.[]' <<< "$TOOL_PATHS"; jq --raw-output '.[]' <<< "$EXTENSION_PATHS")
                  echo "Validated $RELEASE_COUNT release(s), $PREPARED_PR_COUNT prepared PR(s), and $OPEN_PR_COUNT open release PR(s)."

    release-pr:
        name: 📝 Prepare release PR ${{ matrix.pr.headRefName }}
        needs: [release, release-fanout-check]
        if: ${{ !github.event.repository.fork && needs.release.outputs.prs != '' && needs.release.outputs.prs != '[]' }}
        timeout-minutes: 10
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                pr: ${{ fromJSON(needs.release.outputs.prs) }}
        steps:
            - name: 🔑 Create release PR token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            # Release Please rewrites each PR branch on updates. Prepare every returned PR.
            - name: 🕶️ Checkout release PR branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ matrix.pr.headRefName }}
                  token: ${{ steps.app-token.outputs.token }}

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🤖 Configure the commit author
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # The first-release pin forces version 0.0.1, then must be removed before merge so the
            # release config check passes and Release Please can handle subsequent versions.
            - name: 🎉 Retire first-release pins
              run: |
                  node scripts/unpin-release-as.mjs
                  if [ -z "$(git status --porcelain -- release-please-config.json)" ]; then
                      echo "Nothing to retire"
                      exit 0
                  fi
                  git add -- release-please-config.json
                  git commit -m "chore: retire first-release pins"

            - name: 🔧 Sync starter API and builder ranges
              run: node scripts/sync-tool-template-versions.mjs

            - name: 📝 Regenerate READMEs after syncing starter dependencies
              run: pnpm run readme

            - name: 💾 Commit starter dependency range updates
              run: |
                  if git diff --quiet -- tools/create-pumpkin-plugin/templates; then
                      echo "Starter dependency ranges are already current"
                      exit 0
                  fi
                  git add -- \
                      tools/create-pumpkin-plugin/templates/typescript/package.json \
                      tools/create-pumpkin-plugin/templates/javascript/package.json \
                      tools/create-pumpkin-plugin/README.md
                  git commit -m "fix(create-pumpkin-plugin): sync starter tool versions"

            - name: 🏷️ Update action README version examples
              run: pnpm exec pumpkin-plugins-docs action-versions

            - name: 💾 Commit READMEs to the release PR
              run: |
                  if [ -z "$(git status --porcelain)" ]; then
                      echo "READMEs are already up to date"
                      exit 0
                  fi
                  git add -- README.md \
                      'packages/*/README.md' \
                      'tools/*/README.md' \
                      'tools/apis/*/README.md' \
                      'actions/*/README.md' \
                      'extensions/*/README.md'
                  git commit -m "docs: update generated READMEs"

            # Push the preparation commits together so the branch triggers workflows once.
            - name: 📤 Push the release PR preparation
              run: |
                  if [ -z "$(git log --oneline '@{upstream}..HEAD')" ]; then
                      echo "Nothing to push"
                      exit 0
                  fi
                  git push

    publish-tools:
        name: 📦 Publish npm packages
        needs: [release, release-fanout-check]
        if: ${{ !inputs.tool_only || needs.release.outputs.tool_paths_released != '[]' }}
        timeout-minutes: 60
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
            RELEASED_TOOL_PATHS: ${{ needs.release.outputs.tool_paths_released }}
            RELEASE_METADATA: ${{ needs.release.outputs.release_metadata }}
            RELEASE_TARGET_SHA: ${{ inputs.release_commit || github.sha }}
            RELEASE_TOOL_ONLY: ${{ inputs.tool_only }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🕶️ Checkout requested release source
              if: ${{ inputs.tool_only }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.release_commit }}
                  path: release-source
                  persist-credentials: false

            - name: 🔒 Check each tag is the commit this run built
              run: |
                  set -euo pipefail
                  release_tags="$(jq --raw-output --argjson paths "$RELEASED_TOOL_PATHS" --argjson metadata "$RELEASE_METADATA" \
                      '$paths[] as $path | $metadata[$path + "--tag_name"]')"
                  while IFS= read -r RELEASE_TAG; do
                      [ -n "$RELEASE_TAG" ] || continue
                      node scripts/verify-release-tag.mjs "$RELEASE_TAG" "$RELEASE_TARGET_SHA"
                  done <<< "$release_tags"

            - name: 📦 Configure npm OIDC publishing
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: 📤 Publish verified public npm packages
              run: |
                  set -euo pipefail
                  npm_version="$(npm --version)"
                  node --input-type=module - "$npm_version" <<'NODE'
                  const actual = process.argv[2].split('.').map(Number);
                  const minimum = [11, 5, 1];
                  for (let index = 0; index < minimum.length; index += 1) {
                      if ((actual[index] ?? 0) > minimum[index]) break;
                      if ((actual[index] ?? 0) < minimum[index]) {
                          throw new Error(`Trusted npm publishing needs npm 11.5.1 or newer; found ${process.argv[2]}`);
                      }
                  }
                  NODE
                  if [[ "$RELEASE_TOOL_ONLY" != 'true' ]]; then
                      pnpm exec node scripts/publish-pending-tool-releases.mjs
                  fi
                  if [[ "$RELEASE_TOOL_ONLY" == 'true' ]]; then
                      pnpm --dir "$GITHUB_WORKSPACE/release-source" install --frozen-lockfile
                      PUMPKIN_PUBLIC_TOOL_ROOT="$GITHUB_WORKSPACE/release-source" \
                          pnpm exec node scripts/publish-tool-packages.mjs
                  else
                      pnpm exec node scripts/publish-tool-packages.mjs
                  fi

    publish-extensions:
        name: 🧩 Package extension ${{ matrix.path }}
        needs: [release, release-fanout-check]
        if: ${{ needs.release.outputs.extension_paths_released != '[]' }}
        timeout-minutes: 15
        runs-on: ubuntu-26.04
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                path: ${{ fromJSON(needs.release.outputs.extension_paths_released) }}
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ fromJSON(needs.release.outputs.release_metadata)[format('{0}--tag_name', matrix.path)] }}
            EXTENSION_DIRECTORY: ${{ matrix.path }}
        steps:
            - name: 🕶️ Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: 🚀 Bootstrap
              uses: ./.github/common/bootstrap

            - name: 🔒 Check the tag is the commit this run built
              run: node scripts/verify-release-tag.mjs "$TAG" "$GITHUB_SHA"

            - name: 📦 Package VS Code extension
              env:
                  EXTENSION_NAME: ${{ matrix.path }}
              run: |
                  extension_name="${EXTENSION_NAME##*/}"
                  pnpm --filter "./$EXTENSION_NAME" run build
                  pnpm --filter "./$EXTENSION_NAME" run package -- --out "$RUNNER_TEMP/$extension_name.vsix"
                  gh release upload "$TAG" "$RUNNER_TEMP/$extension_name.vsix" --clobber

    plugins:
        name: 📎 Publish ${{ matrix.path }}
        needs: [release, release-fanout-check]
        if: ${{ needs.release.outputs.paths_released != '[]' }}
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                path: ${{ fromJSON(needs.release.outputs.paths_released) }}
        uses: ./.github/workflows/publish-plugin-release.yml
        with:
            tag: ${{ fromJSON(needs.release.outputs.release_metadata)[format('{0}--tag_name', matrix.path)] }}
            release_sha: ${{ fromJSON(needs.release.outputs.release_metadata)[format('{0}--sha', matrix.path)] }}
            market_warn: true
        secrets: inherit
