name: Native components

on:
    workflow_call:
        inputs:
            releases:
                description: Exact native release records, one per tag
                type: string
                default: '[]'
            attach:
                description: Build from exact release tags for subsequent GitHub Release attachment
                type: boolean
                default: false
        outputs:
            platforms:
                description: Supported native target and runner matrix
                value: ${{ jobs.plan.outputs.platforms }}

permissions:
    contents: read

jobs:
    plan:
        name: 🦀 Native matrix
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            platforms: ${{ steps.matrix.outputs.platforms }}
            releases: ${{ steps.matrix.outputs.releases }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/common/bootstrap
            - id: matrix
              shell: bash
              env:
                  RELEASES: ${{ inputs.releases }}
                  ATTACH: ${{ inputs.attach }}
              run: |
                  set -euo pipefail
                  echo "platforms=$(node scripts/native-release.mjs matrix)" >> "$GITHUB_OUTPUT"
                  if [[ "$ATTACH" == true ]]; then
                      echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"
                  else
                      echo "releases=$(node scripts/native-release.mjs ci-releases --sha "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
                  fi

    build:
        name: 🦀 ${{ matrix.release.tagName }} / ${{ matrix.platform.target }}
        needs: [plan]
        if: needs.plan.outputs.releases != '[]'
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 120
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                release: ${{ fromJSON(needs.plan.outputs.releases) }}
                platform: ${{ fromJSON(needs.plan.outputs.platforms).include }}
        env:
            TAG: ${{ matrix.release.tagName }}
            RELEASE_SHA: ${{ matrix.release.sha }}
            TARGET: ${{ matrix.platform.target }}
            ATTACH: ${{ inputs.attach }}
            # Bound compiler memory/stack use for generated pumpkin-data.
            RUST_MIN_STACK: '67108864'
            CARGO_BUILD_JOBS: '2'
        steps:
            - name: Checkout packaging tooling
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Checkout exact native source
              id: source
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ inputs.attach && format('refs/tags/{0}', matrix.release.tagName) || matrix.release.sha }}
                  path: release-source
                  fetch-depth: 0
                  persist-credentials: false
            - name: Download and verify pinned Pumpkin host
              id: host
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  COMPONENT_PATH: ${{ matrix.release.path }}
                  RUNNER_TEMP: ${{ runner.temp }}
              run: |
                  node --input-type=module <<'NODE'
                  import { execFileSync } from 'node:child_process';
                  import { createHash } from 'node:crypto';
                  import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
                  import { join } from 'node:path';

                  const componentPath = process.env.COMPONENT_PATH;
                  if (!/^native\/[a-z0-9]+(?:-[a-z0-9]+)*$/.test(componentPath ?? '')) {
                      throw new Error(`Invalid native component path: ${componentPath}`);
                  }
                  const target = process.env.TARGET;
                  const spec = JSON.parse(readFileSync(join('release-source', componentPath, 'release.json'), 'utf8'));
                  const host = spec.host;
                  const asset = host?.assets?.[target];
                  if (
                      typeof host?.repository !== 'string' ||
                      !/^[\w.-]+\/[\w.-]+$/.test(host.repository) ||
                      typeof host.tag !== 'string' ||
                      !host.tag ||
                      /latest|nightly|[\r\n]/i.test(host.tag) ||
                      !/^[0-9a-f]{40}$/i.test(host.sha ?? '') ||
                      typeof asset?.name !== 'string' ||
                      !/^[\w.+-]+$/.test(asset.name) ||
                      !/^[0-9a-f]{64}$/i.test(asset.sha256 ?? '')
                  ) {
                      throw new Error(`Invalid pinned Pumpkin host metadata for ${target}`);
                  }

                  const api = (repository, endpoint) =>
                      JSON.parse(execFileSync('gh', ['api', `repos/${repository}/${endpoint}`], { encoding: 'utf8' }));
                  let object = api(host.repository, `git/ref/tags/${encodeURIComponent(host.tag)}`).object;
                  for (let depth = 0; object?.type === 'tag' && depth < 5; depth += 1) {
                      object = api(host.repository, `git/tags/${object.sha}`).object;
                  }
                  if (object?.type !== 'commit' || object.sha !== host.sha) {
                      throw new Error(`Pumpkin host tag ${host.tag} does not resolve to pinned source ${host.sha}`);
                  }
                  const release = api(host.repository, `releases/tags/${encodeURIComponent(host.tag)}`);
                  if (release.tag_name !== host.tag) {
                      throw new Error(`GitHub returned a different Pumpkin release than ${host.tag}`);
                  }

                  const wasiSdkLock = JSON.parse(
                      readFileSync(join('release-source', 'tools/static-hermes-runtime/wasi-sdk.lock.json'), 'utf8'),
                  );
                  const wasiSdkRepositoryUrl = new URL(wasiSdkLock.repository);
                  const wasiSdkRepository = wasiSdkRepositoryUrl.pathname.replace(/^\/+|\/+$/g, '').replace(/\.git$/, '');
                  if (
                      wasiSdkRepositoryUrl.hostname !== 'github.com' ||
                      !/^[\w.-]+\/[\w.-]+$/.test(wasiSdkRepository) ||
                      typeof wasiSdkLock.version !== 'string' ||
                      !/^\d+$/.test(wasiSdkLock.version)
                  ) {
                      throw new Error('Invalid pinned WASI SDK release metadata');
                  }
                  const wasiSdkRelease = api(
                      wasiSdkRepository,
                      `releases/tags/wasi-sdk-${encodeURIComponent(wasiSdkLock.version)}`,
                  );
                  if (wasiSdkRelease.tag_name !== `wasi-sdk-${wasiSdkLock.version}`) {
                      throw new Error(`GitHub returned a different WASI SDK release than wasi-sdk-${wasiSdkLock.version}`);
                  }
                  const wasiSdkMetadata = join(process.env.RUNNER_TEMP, 'wasi-sdk-release.json');
                  writeFileSync(wasiSdkMetadata, JSON.stringify(wasiSdkRelease));
                  appendFileSync(
                      process.env.GITHUB_ENV,
                      `PUMPKIN_WASI_SDK_RELEASE_METADATA_FILE=${wasiSdkMetadata}\n`,
                  );

                  const directory = join(process.env.RUNNER_TEMP, 'pumpkin-host');
                  mkdirSync(directory, { recursive: true });
                  execFileSync(
                      'gh',
                      ['release', 'download', host.tag, '--repo', host.repository, '--pattern', asset.name, '--dir', directory, '--clobber'],
                      { stdio: 'inherit' },
                  );
                  const binary = join(directory, asset.name);
                  const digest = createHash('sha256').update(readFileSync(binary)).digest('hex');
                  if (digest !== asset.sha256.toLowerCase()) {
                      throw new Error(`Pumpkin host asset checksum mismatch: expected ${asset.sha256}, got ${digest}`);
                  }
                  appendFileSync(process.env.GITHUB_OUTPUT, `binary=${binary}\n`);
                  NODE
            - uses: ./.github/common/bootstrap
            - name: Resolve exact source pnpm version
              id: source-toolchain
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm_version="$(jq -er '.devEngines.packageManager | select(.name == "pnpm") | .version' release-source/package.json)"
                  if [[ ! "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Tagged source must pin an exact pnpm version, found '$pnpm_version'."
                      exit 1
                  fi
                  echo "pnpm_version=$pnpm_version" >> "$GITHUB_OUTPUT"
            - name: Setup exact source pnpm
              uses: pnpm/action-setup@v6.1.0
              with:
                  version: ${{ steps.source-toolchain.outputs.pnpm_version }}
            - name: Setup Node for exact native source
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: release-source/.node-version
                  architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
                  cache: pnpm
                  cache-dependency-path: release-source/pnpm-lock.yaml
            - name: Install exact native source dependencies
              run: pnpm --dir release-source install --frozen-lockfile
            - name: Validate source and resolve pinned Rust
              id: resolve
              shell: bash
              run: |
                  set -euo pipefail
                  args=()
                  if [[ "$ATTACH" != true ]]; then args+=(--check); fi
                  node scripts/native-release.mjs resolve --tag "$TAG" --sha "$RELEASE_SHA" \
                      --source-root release-source "${args[@]}"
            - name: Install exact native compiler
              shell: bash
              env:
                  RUST_TOOLCHAIN: ${{ steps.resolve.outputs.rust_toolchain }}
              run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
            - name: Setup Static Hermes toolchain
              id: setup-hermes
              uses: ./.github/common/setup-static-hermes
              with:
                  toolchain-config-root: release-source/tools/static-hermes-runtime
            - name: Setup MSVC 2022 toolset 14.44
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1.13.0
              with:
                  arch: ${{ matrix.platform.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}
                  toolset: '14.44'
            - name: Select MSVC linker for Cargo
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $architecture = if ($env:TARGET.StartsWith('aarch64-')) { 'ARM64' } else { 'x64' }
                  $toolsetBin = Join-Path $env:VCToolsInstallDir "bin\Host$architecture\$architecture"
                  $linker = Join-Path $toolsetBin 'link.exe'
                  if (-not (Test-Path -LiteralPath $linker)) {
                      throw "MSVC linker was not found: $linker"
                  }
                  Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolsetBin
                  $cargoTarget = $env:TARGET.ToUpperInvariant().Replace('-', '_')
                  "CARGO_TARGET_${cargoTarget}_LINKER=$linker" >> $env:GITHUB_ENV
            - name: Prepare Static Hermes
              id: prepare-hermes
              working-directory: release-source
              run: pnpm --filter @pumpkin-plugins/static-hermes-runtime prepare-hermes
            - name: Build WASI capability package for native tests
              working-directory: release-source
              run: pnpm --filter @pumpkin-plugins/wasi-capabilities build
            - name: Save Static Hermes build cache
              if: steps.prepare-hermes.outcome == 'success'
              uses: actions/cache/save@v6.1.0
              with:
                  path: ${{ github.workspace }}/.cache/hermes
                  key: ${{ steps.setup-hermes.outputs.hermes-cache-key }}
            - name: Build, load-test and package native component
              id: build
              shell: bash
              env:
                  HOST_BINARY: ${{ steps.host.outputs.binary }}
              run: |
                  set -euo pipefail
                  args=(--check)
                  if [[ "$ATTACH" == true ]]; then args=(); fi
                  node scripts/native-release.mjs build --tag "$TAG" --sha "$RELEASE_SHA" \
                      --target "$TARGET" --source-root release-source --host "$HOST_BINARY" \
                      --output "$RUNNER_TEMP/native-assets" "${args[@]}"
            - name: Retain native verification evidence
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: native-${{ matrix.release.tagName }}-${{ matrix.platform.target }}
                  path: |
                      ${{ runner.temp }}/native-assets/*.*
                      ${{ runner.temp }}/native-assets/evidence/**
                  if-no-files-found: warn
                  retention-days: 7
