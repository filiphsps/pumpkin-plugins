name: Bootstrap
description: Install pnpm and Node, restore and share pnpm and Turborepo caches, then install dependencies

runs:
    using: composite
    steps:
        - name: 📦 Setup pnpm
          uses: pnpm/action-setup@v6.1.0

        - name: 🟢 Setup Node
          uses: actions/setup-node@v7.1.0
          with:
              node-version-file: .node-version
              cache: pnpm

        - name: 📥 Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile

        - name: ♻️ Restore and save shared Turborepo cache
          uses: actions/cache@v6.1.0
          with:
              path: .turbo
              key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
              restore-keys: |
                  turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
                  turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-
                  turbo-${{ runner.os }}-${{ github.sha }}-
                  turbo-${{ runner.os }}-
