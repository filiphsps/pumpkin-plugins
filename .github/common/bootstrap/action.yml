name: Bootstrap
description: Install pnpm and Node, restore and share pnpm and Turborepo caches, then install dependencies

inputs:
    cache-suffix:
        description: Stable matrix identity to keep parallel Turborepo cache writers separate
        required: false
        default: ''

runs:
    using: composite
    steps:
        - name: 📦 Setup pnpm
          uses: pnpm/action-setup@v6.1.0

        - name: 🟢 Setup Node
          uses: actions/setup-node@v7.1.0
          with:
              node-version-file: .node-version
              cache: pnpm

        - name: 📥 Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile

        - name: ♻️ Restore and save shared Turborepo cache
          uses: actions/cache@v6.1.0
          with:
              path: .turbo
              key: turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}${{ inputs.cache-suffix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
              restore-keys: |
                  turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}${{ inputs.cache-suffix }}-${{ github.sha }}-
                  turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}${{ inputs.cache-suffix }}-
                  turbo-v2-${{ runner.os }}-${{ runner.arch }}-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  turbo-v2-${{ runner.os }}-${{ runner.arch }}-
