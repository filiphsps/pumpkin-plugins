name: Setup Static Hermes
description: Set up pinned host tools and cache the configured wit-bindgen and Static Hermes build

inputs:
    toolchain-config-root:
        description: Directory containing the WASI SDK and toolchain version configuration
        required: false
        default: tools/static-hermes-runtime

outputs:
    hermes-cache-key:
        description: Cache key to use when saving the prepared Static Hermes build
        value: ${{ steps.hermes-workspace-cache.outputs.cache-primary-key }}
    hermes-cache-hit:
        description: Whether the prepared Static Hermes build was restored from an exact cache key match
        value: ${{ steps.hermes-workspace-cache.outputs.cache-hit }}
    cmake-version:
        description: Pinned CMake version for Static Hermes builds
        value: ${{ steps.versions.outputs.cmake-version }}
    ninja-version:
        description: Pinned Ninja version for Static Hermes builds
        value: ${{ steps.versions.outputs.ninja-version }}
    rust-toolchain-version:
        description: Pinned Rust toolchain version from toolchain-versions.json
        value: ${{ steps.versions.outputs.rust-toolchain-version }}

runs:
    using: composite
    steps:
        - name: 🔎 Read configured toolchain versions
          id: versions
          shell: bash
          env:
              TOOLCHAIN_CONFIG_ROOT: ${{ inputs['toolchain-config-root'] }}
          run: |
              config="$GITHUB_WORKSPACE/$TOOLCHAIN_CONFIG_ROOT"
              wasi_sdk_version="$(jq -er '.version' "$config/wasi-sdk.lock.json")"
              cmake_version="$(jq -er '.tools.cmake' "$config/toolchain-versions.json")"
              ninja_version="$(jq -er '.tools.ninja' "$config/toolchain-versions.json")"
              wit_bindgen_version="$(jq -er '.tools["wit-bindgen"]' "$config/toolchain-versions.json")"
              rust_toolchain_version="$(jq -er '.tools.rust' "$config/toolchain-versions.json")"
              {
                  echo "cmake-version=$cmake_version"
                  echo "ninja-version=$ninja_version"
                  echo "wasi-sdk-version=$wasi_sdk_version"
                  echo "wit-bindgen-version=$wit_bindgen_version"
                  echo "rust-toolchain-version=$rust_toolchain_version"
              } >> "$GITHUB_OUTPUT"

        - name: 🐍 Setup Python for pinned host tools
          uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
          with:
              python-version: '3.13'

        - name: 🔎 Resolve host Python version
          id: host-python
          shell: bash
          run: |
              python_version="$(python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
              echo "version=$python_version" >> "$GITHUB_OUTPUT"

        - name: 💾 Cache pinned CMake and Ninja
          id: host-tools-cache
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ runner.temp }}/host-tools
              key: static-hermes-host-tools-v1-cmake-${{ steps.versions.outputs.cmake-version }}-ninja-${{ steps.versions.outputs.ninja-version }}-python-${{ steps.host-python.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

        - name: 📦 Install pinned CMake and Ninja
          if: steps.host-tools-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
          shell: bash
          env:
              CMAKE_VERSION: ${{ steps.versions.outputs.cmake-version }}
              NINJA_VERSION: ${{ steps.versions.outputs.ninja-version }}
          run: |
              host_tools="$RUNNER_TEMP/host-tools"
              python -m pip install --disable-pip-version-check --target "$host_tools" \
                  "cmake==$CMAKE_VERSION" "ninja==$NINJA_VERSION"

        - name: 📦 Install pinned CMake and Ninja
          if: steps.host-tools-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
          shell: pwsh
          env:
              CMAKE_VERSION: ${{ steps.versions.outputs.cmake-version }}
              NINJA_VERSION: ${{ steps.versions.outputs.ninja-version }}
          run: |
              $hostTools = Join-Path $env:RUNNER_TEMP 'host-tools'
              $cmakePackage = "cmake==$env:CMAKE_VERSION"
              $ninjaPackage = "ninja==$env:NINJA_VERSION"
              python -m pip install --disable-pip-version-check --target $hostTools $cmakePackage $ninjaPackage

        - name: 🔧 Export pinned host tool paths
          if: runner.os != 'Windows'
          shell: bash
          run: |
              host_tools="$RUNNER_TEMP/host-tools"
              {
                  echo "$host_tools/bin"
                  echo "$host_tools/cmake/data/bin"
              } >> "$GITHUB_PATH"

        - name: 🔧 Export pinned host tool paths
          if: runner.os == 'Windows'
          shell: pwsh
          run: |
              $hostTools = Join-Path $env:RUNNER_TEMP 'host-tools'
              Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $hostTools 'bin')
              Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $hostTools 'cmake/data/bin')

        - name: 💾 Cache wit-bindgen ${{ steps.versions.outputs.wit-bindgen-version }}
          id: wit-bindgen-cache
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ runner.temp }}/wit-bindgen-${{ steps.versions.outputs.wit-bindgen-version }}
              key: static-hermes-wit-bindgen-${{ steps.versions.outputs.wit-bindgen-version }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.versions.outputs.rust-toolchain-version }}

        - name: 🦀 Install Rust ${{ steps.versions.outputs.rust-toolchain-version }} and wit-bindgen ${{ steps.versions.outputs.wit-bindgen-version }}
          if: steps['wit-bindgen-cache'].outputs['cache-hit'] != 'true'
          shell: bash
          env:
              RUST_TOOLCHAIN_VERSION: ${{ steps.versions.outputs.rust-toolchain-version }}
              WIT_BINDGEN_VERSION: ${{ steps.versions.outputs.wit-bindgen-version }}
          run: |
              set -euo pipefail
              rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
              cargo "+$RUST_TOOLCHAIN_VERSION" install wit-bindgen-cli --version "$WIT_BINDGEN_VERSION" --locked \
                  --root "$RUNNER_TEMP/wit-bindgen-$WIT_BINDGEN_VERSION"

        - name: 💾 Cache Static Hermes build
          id: hermes-workspace-cache
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ github.workspace }}/.cache/hermes
              key: static-hermes-workspace-cache-v6-cmake-${{ steps.versions.outputs.cmake-version }}-ninja-${{ steps.versions.outputs.ninja-version }}-wasi-sdk-${{ steps.versions.outputs.wasi-sdk-version }}-wit-bindgen-${{ steps.versions.outputs.wit-bindgen-version }}-rust-${{ steps.versions.outputs.rust-toolchain-version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/wasi-sdk.lock.json', inputs['toolchain-config-root']), format('{0}/toolchain-versions.json', inputs['toolchain-config-root'])) }}-${{ hashFiles(format('{0}/hermes-source.lock.json', inputs['toolchain-config-root']), format('{0}/hermes-patches/*.patch', inputs['toolchain-config-root']), format('{0}/cmake/**', inputs['toolchain-config-root']), format('{0}/src/hermes/**', inputs['toolchain-config-root']), format('{0}/src/cli.ts', inputs['toolchain-config-root'])) }}

        - name: 🔧 Export Static Hermes toolchain paths
          shell: bash
          run: |
              wit_bindgen="$RUNNER_TEMP/wit-bindgen-${{ steps.versions.outputs.wit-bindgen-version }}/bin/wit-bindgen"
              if [[ "$RUNNER_OS" == 'Windows' ]]; then
                  wit_bindgen="$wit_bindgen.exe"
              fi
              {
                  echo "STATIC_HERMES_CACHE_DIR=$GITHUB_WORKSPACE/.cache/hermes"
                  echo "STATIC_HERMES_SOURCE_DIR=$GITHUB_WORKSPACE/.cache/hermes/source"
                  echo "STATIC_HERMES_HOST_BUILD_DIR=$GITHUB_WORKSPACE/.cache/hermes/build-host"
                  echo "STATIC_HERMES_WASI_BUILD_DIR=$GITHUB_WORKSPACE/.cache/hermes/build-wasip2"
                  echo "WIT_BINDGEN=$wit_bindgen"
              } >> "$GITHUB_ENV"
